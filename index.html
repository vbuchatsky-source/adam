<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>אדם במסע הצירים</title>
<style>
:root{--x:#ff4d6d;--y:#3a86ff;--ink:#2b2d42;--muted:#6b7280;--gold:#ffbe0b;--green:#2ec4b6;--purple:#8338ec;--orange:#fb8500;--pink:#ff70a6;--teal:#06d6a0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;font-family:"Rubik","Varela Round","Segoe UI","Arial Hebrew",Arial,sans-serif;color:var(--ink);
 background:radial-gradient(circle at 12% 12%,#fff0cc 0,transparent 38%),radial-gradient(circle at 90% 85%,#d9f0ff 0,transparent 42%),linear-gradient(160deg,#eaf6ff,#f4ecff);min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
.co{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700;white-space:nowrap}
.co .cx{color:var(--x);font-style:normal}.co .cy{color:var(--y);font-style:normal}
.tx{color:var(--x);font-weight:700}.ty{color:var(--y);font-weight:700}
/* top bar */
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#ffffffcc;backdrop-filter:blur(6px);box-shadow:0 2px 12px #3a86ff1a;position:sticky;top:0;z-index:5}
.brand{font-size:24px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.brand .lx{color:var(--x)}.brand .ly{color:var(--y)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px;box-shadow:0 2px 8px #0001}
.btn{border:none;border-radius:18px;padding:12px 22px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(180deg,#4895ff,#3a6bff);box-shadow:0 5px 0 #2747b8;transition:transform .08s,box-shadow .08s,opacity .2s}
@media (hover:hover){.btn:hover{filter:brightness(1.07)}.opt:hover{background:#f5f9ff}.mission:hover{transform:translateY(-4px) rotate(-.5deg)}}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2747b8}
.btn.green{background:linear-gradient(180deg,#34d8a8,#12b886);box-shadow:0 5px 0 #0b8a63}
.btn.green:active{box-shadow:0 1px 0 #0b8a63}
.btn.orange{background:linear-gradient(180deg,#ffb347,#fb8500);box-shadow:0 5px 0 #b65f00}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d4d9e6}
.btn.small{font-size:16px;padding:8px 14px;border-radius:14px}
.btn:disabled{opacity:.5;background:#b9c0cd;box-shadow:0 5px 0 #98a0af;cursor:default;transform:none}
.btn.pulse:not(:disabled){animation:pulse 1.2s 3}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.screen{display:none}.screen.on{display:block}
/* mascot */
.robo{width:100%;height:100%;overflow:visible}
.robo .m-big,.robo .m-oops{display:none}
.mood-happy .robo .m-happy{display:none}.mood-happy .robo .m-big{display:inline}
.mood-oops .robo .m-happy{display:none}.mood-oops .robo .m-oops{display:inline}
.robo .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mascot{width:96px;height:104px;flex:none}
.mood-happy .mascot{animation:hop .6s ease 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-4deg)}}
.mood-oops .mascot{animation:tilt .8s ease}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}}
.talk{display:flex;align-items:flex-start;gap:10px}
.bubble{position:relative;background:#fff;border-radius:20px;padding:14px 16px;font-size:19px;line-height:1.55;box-shadow:0 4px 14px #0000000f;flex:1;min-height:70px}
.bubble:before{content:"";position:absolute;right:-10px;top:26px;border:10px solid transparent;border-left-color:#fff;border-right:0}
.mood-happy .bubble{background:#eafff6}.mood-happy .bubble:before{border-left-color:#eafff6}
.mood-oops .bubble{background:#fff6e5}.mood-oops .bubble:before{border-left-color:#fff6e5}
/* home */
.home{max-width:1280px;margin:0 auto;padding:22px 20px 40px}
.hero{display:flex;align-items:center;gap:22px;background:#ffffffd9;border-radius:30px;padding:20px 26px;box-shadow:0 8px 26px #3a86ff1f}
.hero .mascot{width:150px;height:162px}
.hero h1{margin:0 0 6px;font-size:34px}
.hero p{margin:0;font-size:20px;line-height:1.6;color:#41435a}
.stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.stats .pill{font-size:17px}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:26px}
.mission{position:relative;background:#fff;border-radius:26px;padding:16px 18px 18px;border:none;text-align:right;box-shadow:0 6px 0 #dfe5f3,0 10px 22px #0000000d;transition:transform .15s;display:flex;gap:14px;align-items:center;color:var(--ink)}
.mission .num{position:absolute;top:-10px;right:-8px;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#5a3d00;font-weight:900;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 #d39b00}
.mission .ic{width:72px;height:72px;flex:none;border-radius:20px;background:#f3f7ff}
.mission h3{margin:0 0 4px;font-size:20px}
.mission{min-height:128px}
.okline{margin-top:8px;padding-top:8px;border-top:2px dashed #b8ecd9;font-weight:700;color:#0b8a63}
.mission p{margin:0;font-size:15.5px;color:var(--muted);line-height:1.4}
.mission .done{margin-top:5px;display:flex;gap:2px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
.mission{cursor:pointer;align-items:flex-start}
.mission .mbody{display:flex;flex-direction:column;flex:1;min-width:0}
.mission .practice{margin-top:10px;align-self:stretch;font-size:16px;padding:9px 10px;background:linear-gradient(180deg,#34d8a8,#12b886);box-shadow:0 4px 0 #0b8a63}
.stmt{margin-top:8px;background:#f1f6ff;border-right:5px solid #3a86ff;border-radius:14px;padding:10px 12px;font-size:21px}
.tfopts .opt{font-size:23px;padding:16px 8px}
.tfopts .opt:first-child{color:#0b8a63}.tfopts .opt:nth-child(2){color:#c9184a}
.mission.big{grid-column:span 3;background:linear-gradient(135deg,#fff7e0,#ffe9f2)}
.mission.big .ic{background:#fff;width:96px;height:96px}
.mission.big h3{font-size:25px}
.badge-start{position:absolute;top:-12px;left:14px;background:var(--x);color:#fff;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;animation:pulse 1.4s 4}
.star{width:22px;height:22px;display:inline-block;vertical-align:middle}
/* stage */
.stage{display:flex;gap:18px;padding:14px 18px;align-items:flex-start;justify-content:center}
.side{width:440px;flex:none;display:flex;flex-direction:column;gap:12px}
.planeWrap{height:calc(100vh - 92px);max-height:760px;aspect-ratio:1;max-width:calc(100vw - 500px);min-height:420px}
.planeWrap,.plane{touch-action:none}
.planeWrap,.plane,.plane *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.plane{width:100%;height:100%;display:block}
.card{background:#ffffffe6;border-radius:24px;padding:14px 16px;box-shadow:0 6px 18px #0000000d}
.title{font-size:24px;font-weight:800;margin:0;display:flex;align-items:center;gap:10px}
.steps{display:flex;gap:6px;margin-top:8px}
.steps i{flex:1;height:10px;border-radius:6px;background:#e3e8f4}
.steps i.on{background:linear-gradient(90deg,#ffbe0b,#fb8500)}
.steps i.cur{background:#ffd166}
.task{background:#fff;border:3px dashed #ffbe0b;border-radius:20px;padding:12px 14px;font-size:20px;font-weight:700;line-height:1.5}
.task.ok{border:3px solid var(--teal);background:#effff9}
.task:empty{display:none}
.navrow{display:flex;gap:10px;justify-content:space-between}
.readout{display:flex;flex-direction:column;gap:6px}
.ro{display:flex;align-items:center;gap:8px;font-size:21px;background:#fff;border-radius:16px;padding:6px 12px}
.ro .dotc{width:18px;height:18px;border-radius:50%;flex:none}
.ro .lab{font-weight:800}
.ro .bdg{margin-inline-start:auto;font-size:14px;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff}
.bdg.bx{background:var(--x)}.bdg.by{background:var(--y)}.bdg.bo{background:linear-gradient(90deg,var(--x),var(--y))}.bdg.bs{background:var(--orange)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:none;background:#fff;border-radius:18px;padding:14px 10px;font-size:21px;font-weight:700;color:var(--ink);box-shadow:0 5px 0 #d9dfee;transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #d9dfee}
.opt.wrong{background:#ffe3e3;color:#b4485b;box-shadow:0 5px 0 #f5b8b8;opacity:.7;text-decoration:line-through;pointer-events:none}
.opt.right{background:#d8fff1;box-shadow:0 5px 0 #7be0bf}
.opt:disabled{cursor:default}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.keypad button{border:none;background:#fff;border-radius:14px;font-size:24px;font-weight:800;padding:10px 0;box-shadow:0 4px 0 #d9dfee;color:var(--ink)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9dfee}
.numrow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.numdisp{flex:1;height:58px;border-radius:16px;background:#fff;border:3px solid #cfd8ee;font-size:34px;font-weight:900;display:grid;place-items:center;direction:ltr}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{display:flex;gap:5px;flex:1}
.prog span{flex:1;height:30px;border-radius:10px;background:#e6ebf5;display:grid;place-items:center}
.prog span.cur{background:#fff3c4;outline:3px solid var(--gold)}
.prog span.st{background:#fff4cc}
.prog span.ok{background:#dcfff3}
.prog svg{width:22px;height:22px}
.scorebig{font-size:22px;font-weight:900;background:linear-gradient(90deg,#ffbe0b,#fb8500);color:#fff;border-radius:16px;padding:6px 14px;box-shadow:0 4px 0 #c46a00;white-space:nowrap}
.streak{font-size:16px;font-weight:800;color:#e85d04;background:#fff1e6;border-radius:999px;padding:4px 10px}
.streak:empty{display:none}
.prompt{font-size:22px;font-weight:700;line-height:1.55;margin:4px 0 0}
.qnum{font-size:15px;color:var(--muted);font-weight:700}
.hintline{font-size:15px;color:var(--muted);margin-top:6px}
/* summary */
.sumcard{max-width:720px;margin:40px auto;background:#fff;border-radius:34px;padding:30px;text-align:center;box-shadow:0 10px 30px #3a86ff22}
.sumscore{font-size:96px;font-weight:900;line-height:1;background:linear-gradient(90deg,#ff4d6d,#fb8500,#ffbe0b);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.sumstars{display:flex;justify-content:center;gap:6px;margin:16px 0}
.sumstars svg{width:46px;height:46px}
.sumstars svg.pop{animation:popin .4s both}
@keyframes popin{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.summsg{font-size:26px;font-weight:800;margin:10px 0 6px}
.sumsub{font-size:19px;color:#555;margin-bottom:20px;line-height:1.5}
.trophy{width:140px;height:140px;margin:0 auto;animation:hop 1s ease infinite}
/* modal */
.modal{position:fixed;inset:0;background:#2b2d4266;display:none;place-items:center;z-index:20}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:30px;padding:26px 30px;max-width:620px;width:92%;text-align:center;box-shadow:0 20px 50px #0003;animation:popin .3s both}
.modal h2{margin:6px 0 10px;font-size:30px}
.modal .rules{text-align:right;font-size:19px;line-height:1.7}
.modal .rules li{margin-bottom:6px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;display:none}
/* plane svg */
.plane .board{fill:#fff}
.plane .grid{stroke:#e4ebf8;stroke-width:1.3}
.plane .grid.g5{stroke:#ccd8f0}
.plane .axis{stroke-width:4;stroke-linecap:round;transition:stroke-width .2s}
.plane .ax-x{stroke:var(--x)}.plane .ax-y{stroke:var(--y)}
.plane .axis.glow{stroke-width:9}
.plane .tick{font-size:14px;fill:#7a8199;font-weight:600;font-family:inherit}
.plane .axlab{font-size:24px;font-weight:900;font-style:italic;font-family:Georgia,serif}
.plane .pt .hit{fill:transparent}
.plane .pt.drag,.plane .pt.tap{cursor:grab}
.plane .pt.dragging{cursor:grabbing}
.plane .pt .dot{stroke:#fff;stroke-width:4;transform-box:fill-box;transform-origin:center;transition:transform .15s}
.plane .pt.dragging .dot{transform:scale(1.3)}
.plane .pt.drag .ring{fill:none;stroke-width:3;stroke-dasharray:5 5;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (hover:hover){.plane .pt.tap:hover .dot{transform:scale(1.2)}}
.plane .plabel{font-size:20px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:5px;font-family:inherit}
.plane .seg{stroke:var(--orange);stroke-width:7;stroke-linecap:round}
.plane .segdot{fill:#fff;stroke:var(--orange);stroke-width:2}
.plane .segpill rect{fill:var(--orange)}
.plane .segpill text{fill:#fff;font-weight:900;font-size:20px;font-family:inherit}
.plane .guide{stroke-width:3;stroke-dasharray:7 6;fill:none}
.plane .tpill rect{rx:9}
.plane .tpill text{fill:#fff;font-weight:900;font-size:15px;font-family:inherit}
.plane .oring{fill:none;stroke:#8338ec;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:oring 1s infinite}
@keyframes oring{0%{transform:scale(1);opacity:1}100%{transform:scale(3.2);opacity:0}}
.plane .wrongpt .dot{animation:blinkred .5s 2}
@keyframes blinkred{50%{fill:#ff4d6d}}
.plane .goodpt .dot{stroke:#06d6a0;stroke-width:6}
.legend{font-size:15px;color:var(--muted);display:flex;gap:14px;justify-content:center}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* ===== phone / narrow screens ===== */
@media (max-width:820px){
  body{overflow-x:hidden}
  .top{height:auto;min-height:54px;padding:6px 10px;gap:6px;padding-top:max(6px,env(safe-area-inset-top))}
  .brand{font-size:18px}
  .top .btn.small{font-size:15px;padding:8px 10px}
  .top .pill{font-size:16px;padding:5px 10px}
  .top .rtxt,.brand .rocket{display:none}
  .brand{white-space:nowrap;font-size:19px}
  .home{padding:12px 10px 30px}
  .hero{flex-direction:column;text-align:center;padding:14px;gap:6px;border-radius:24px}
  .hero .mascot{width:96px;height:104px}
  .hero h1{font-size:28px}
  .hero p{font-size:17px}
  .stats{justify-content:center}
  .stats .pill{font-size:14px;padding:5px 10px}
  .map{grid-template-columns:1fr;gap:16px;margin-top:18px}
  .mission,.mission.big{grid-column:auto;min-height:0;padding:14px}
  .mission .ic{width:64px;height:64px}
  .mission.big .ic{width:72px;height:72px}
  .mission.big h3{font-size:21px}
  .stage{flex-direction:column;align-items:stretch;gap:10px;padding:10px 10px 28px}
  .side{display:contents}
  .planeWrap{width:100%;height:auto;max-width:none;max-height:none;min-height:0;aspect-ratio:1/1;order:5}
  .stage>.side>*{order:6}
  /* lesson: title, explanation, task, BOARD, answers, readout, nav */
  #lesson .side>.card{order:1}#lTalk{order:2}#lTask{order:3}#lPlane{order:4}#lAns{order:5}#lRead{order:6}#lesson .navrow{order:7}
  /* quiz: score+question, BOARD, answers, mascot, readout, next */
  #quiz .side>.card{order:1}#qPlane{order:2}#qAns{order:3}#qTalk{order:4}#qRead{order:5}#quiz .navrow{order:6}
  /* sandbox */
  #sandbox .side>.card{order:1}#sTalk{order:2}#sPlane{order:3}#sRead{order:4}#sInfo{order:5}#sandbox .navrow{order:6}
  .card{padding:12px}
  .title{font-size:20px}
  .mascot{width:64px;height:70px}
  .bubble{font-size:17px;padding:10px 12px;min-height:0}
  .bubble:before{top:18px}
  .task{font-size:18px;padding:10px 12px}
  .prompt{font-size:19px}
  .scorebig{font-size:18px;padding:4px 10px}
  .prog{gap:3px}.prog span{height:24px;border-radius:7px}.prog svg{width:17px;height:17px}
  .ro{font-size:18px}
  .opt{font-size:19px;padding:14px 8px;min-height:56px}
  .btn{font-size:18px;padding:12px 18px;min-height:50px}
  .navrow .btn{flex:1}
  .keypad button{font-size:22px;padding:12px 0;min-height:50px}
  .sumcard{margin:14px 10px;padding:20px 14px;border-radius:26px}
  .sumscore{font-size:72px}
  .sumstars{gap:2px;flex-wrap:wrap}.sumstars svg{width:28px;height:28px}
  .summsg{font-size:22px}.sumsub{font-size:17px}
  .trophy{width:100px;height:100px}
  .modal .box{padding:18px 16px}.modal h2{font-size:24px}.modal .rules{font-size:16.5px}
}
/* ===== v2: plan, hub, keypad fields ===== */
.hero .heroTxt{flex:1;min-width:0}
.hero p{font-size:19px}
.plan{max-width:940px;margin:24px auto 0}
.planTitle{margin:0 0 8px;font-size:28px}
.pbarTxt{font-size:20px;margin-bottom:8px}
.pbar{display:flex;gap:5px}
.pbar i{flex:1;height:20px;border-radius:10px;background:#e3e8f4}
.pbar i.on{background:linear-gradient(90deg,#34d8a8,#12b886)}
.pbar i.cur{background:#ffd166;outline:3px solid var(--gold)}
.bigcont{width:100%;font-size:26px;padding:18px 22px;margin:14px 0 20px;animation:pulse 1.6s 3}
.units{display:flex;flex-direction:column;gap:18px}
.unit{position:relative;display:flex;gap:14px;align-items:center;background:#fff;border-radius:26px;padding:16px 18px;border:none;text-align:right;color:var(--ink);width:100%;cursor:pointer;box-shadow:0 6px 0 #dfe5f3,0 10px 22px #0000000d}
.unit.done{background:#effff9;box-shadow:0 6px 0 #b8ecd9}
.unit.next{outline:4px solid var(--gold)}
.unit.locked{background:#eef0f6;color:#7a8199;box-shadow:0 6px 0 #d4d9e6;cursor:pointer}
.unit.locked .ic{opacity:.45}
.unit .num{position:absolute;top:-10px;right:-8px;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#5a3d00;font-weight:900;font-size:21px;display:grid;place-items:center;box-shadow:0 3px 0 #d39b00}
.unit.locked .num{background:#c9cfdd;color:#fff;box-shadow:0 3px 0 #a9b0c2}
.unit .ic{width:72px;height:72px;flex:none;border-radius:20px;background:#f3f7ff}
.unit .ubody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.unit h3{margin:0;font-size:22px}
.unit p{margin:0;font-size:16px;color:var(--muted)}
.unit .ex{font-size:14px;color:#8a90a6;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{background:#eef2fb;border-radius:999px;padding:3px 11px;font-weight:800;font-size:15px;color:#5b6180}
.chip.ok{background:#d8fff1;color:#0b8a63}
.chip small{font-weight:700}
.lockmsg{font-size:15px;font-weight:700}
.ustars{display:flex;flex-direction:column;align-items:center;font-size:24px;min-width:62px}
.ustars .star{width:20px;height:20px}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.extras .mission{min-height:0;align-items:center}
.extras .mission.big{grid-column:auto;order:2}
.hub{max-width:900px}
.hub .qnum{margin-bottom:4px}
.hubic{display:inline-block;width:46px;height:46px;vertical-align:middle;margin-inline-end:10px}
.steplist{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.hstep{display:flex;align-items:center;gap:14px;background:#fff;border:none;border-radius:22px;padding:16px 18px;text-align:right;color:var(--ink);box-shadow:0 5px 0 #dfe5f3;cursor:pointer;font-size:19px}
.hstep .hs-n{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#5a3d00;font-weight:900;font-size:21px;display:grid;place-items:center;flex:none}
.hstep.done{background:#effff9;box-shadow:0 5px 0 #b8ecd9}.hstep.done .hs-n{background:var(--teal);color:#fff}

const fmt=n=>{n=Math.round(n*100)/100;return n<0?'\u2212'+(-n):''+n;};

const uniq=ps=>new Set(ps.map(p=>p.join(','))).size===ps.length;
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
const K=(...a)=>a.map(v=>Array.isArray(v)?'('+v.map(e=>Array.isArray(e)?'['+e+']':e).join(',')+')':String(v)).join('|');

const collinear=(a,b,c)=>cross(a,b,c)===0;
const dist2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
function noThreeCollinear(ps){for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)for(let k=j+1;k<ps.length;k++)if(collinear(ps[i],ps[j],ps[k]))return false;return true;}
function isTriangle(ps){return ps.length===3&&uniq(ps)&&!collinear(ps[0],ps[1],ps[2]);}
function isQuad(ps){return ps.length===4&&uniq(ps)&&noThreeCollinear(ps);}
function isPenta(ps){return ps.length===5&&uniq(ps)&&noThreeCollinear(ps);}
function isPara(ps){if(!isQuad(ps))return false;const [a,b,c,d]=ps;const eq=(p,q,r,s)=>p[0]+q[0]===r[0]+s[0]&&p[1]+q[1]===r[1]+s[1];return eq(a,c,b,d)||eq(a,b,c,d)||eq(a,d,b,c);}
function isRect(ps){if(!isPara(ps))return false;const [a,b,c,d]=ps;const eq=(p,q,r,s)=>p[0]+q[0]===r[0]+s[0]&&p[1]+q[1]===r[1]+s[1];
  if(eq(a,c,b,d))return dist2(a,c)===dist2(b,d);if(eq(a,b,c,d))return dist2(a,b)===dist2(c,d);return dist2(a,d)===dist2(b,c);}
function isSquare(ps){if(!isRect(ps))return false;const [a,b,c,d]=ps;const eq=(p,q,r,s)=>p[0]+q[0]===r[0]+s[0]&&p[1]+q[1]===r[1]+s[1];
  // diagonals of a rectangle: find them, adjacent sides equal
  let o;if(eq(a,c,b,d))o=[a,b,c,d];else if(eq(a,b,c,d))o=[a,c,b,d];else o=[a,b,d,c];
  return dist2(o[0],o[1])===dist2(o[1],o[2]);}

/* ============ storage ============ */

/* ============ plane (configurable scales) ============ */

function keypad(host,cb,o){

  host.innerHTML=`<div class="card"><div class="numrow${n>1?' multi':''}"><div class="fields${n>1&&!fl?' pairs':''}${fl?' fl':''}">${fields}</div><button class="btn green" data-ok="1">בדוק ✓</button></div>
   <div class="keypad">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-n="${d}">${d}</button>`).join('')}</div>
   <div class="keyrow">${neg?'<button class="btn ghost small" data-pm="1">± מינוס</button>':''}${n>1&&!fl?'<button class="btn ghost small" data-comma="1">, הבא</button>':''}<button class="btn ghost small" data-del="1">⌫ מחק</button></div></div>`;

  const upd=()=>F.forEach((d,i)=>{const v=vals[i];d.textContent=(v===''||v==='-')?(v==='-'?'\u2212?':'?'):v.replace('-','\u2212');d.classList.toggle('act',n>1&&i===cur);});
  F.forEach((d,i)=>d.onclick=()=>{cur=i;upd();});
  const next=()=>{if(cur<n-1){cur++;upd();}};
  host.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const v=vals[cur];const sg=v.startsWith('-')?'-':'';let dg=v.replace('-','');if(dg.length<3){dg=String(+(dg+b.dataset.n));vals[cur]=sg+dg;upd();sfx('tick');}});

  return Aq(spec,{key:K('sharedRay',type,seed),kind:'mc',prompt:`לזוויות ${angN([p,V,q])} ו-${angN([q,V,s])} יש <b>קרן משותפת</b>. מהי?`,options:opts,
   hint:`קרן משותפת היא קרן שמופיעה <b>בשתי הזוויות</b>. חפש את האות שמופיעה בשני השמות (חוץ מהקודקוד ${V}) – היא קובעת את הקרן.`,after(P){}});},1,['fan3',1,{}]);
ADEF('whichComposed',(type,seed,o)=>{o=o||{};const {spec,V,p,q,s}=sumDiag(type,seed,o,true);const r=RNG(seed*47+9);const A=useAlt(spec)?(n=>alt(spec,r,n)):(n=>n);
  const whole=spec.arcs.find(a=>canonArc(spec,a)===canonName(spec,[p,V,s]));spec.tapMode='arc';const n1=A([p,V,q]),n2=A([q,V,s]);
  return Aq(spec,{key:K('whichComposed',type,seed),kind:'tap',tgt:[p,V,s],prompt:`הקש על הקשת של הזווית <b>שמורכבת מ</b>-${angN(n1)} <b>ו</b>-${angN(n2)}`,tapCheck:id=>id===whole.id,sol:whole.id,
   hint:`צריך את הזווית <b>הגדולה</b> שמכילה את שתי הקטנות: היא מתחילה בקרן ${V}${p} ונגמרת בקרן ${V}${s}. חפש את הקשת הגדולה שעוברת מעל שתי הקטנות.`,after(P){P.highlight(whole.id);}});},1,['fan3',1,{}]);

ADEF('wholeNames',(type,seed,o)=>{o=o||{};const {spec,V,p,q,s}=sumDiag(type,seed,o,true);const r=RNG(seed*61+5);
  const whole=spec.arcs.find(a=>canonArc(spec,a)===canonName(spec,[p,V,s]));const nm=[whole.a,V,whole.b];const G=equivStrings(spec,nm);const good=[nm].concat(r.shuf(G.filter(x=>sk(x)!==sk(nm))).slice(0,r.ri(1,2)));

{id:6,icon:'seg',title:'קטע המקביל לציר',sub:'אותו X, אותו Y, ואורך הקטע',ex:'תרגילים 25–28',

{id:8,icon:'rect',title:'מלבנים וריבועים מקבילים לצירים',sub:'קודקודים חסרים ואורכי צלעות',ex:'תרגילים 32–33',

/* ============ question banks + 15-question sessions ============ */
const SESSION_N=15,PER_LEVEL=5,BANK_N=100,LV_QUOTA=[33,34,33];   /* bank per topic: curated + generated = 100 (33 easy / 34 medium / 33 hard) */
const hashStr=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
function mulberry(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
/* the bank must be identical on every load (so "recently seen" ids stay meaningful) -> generate it with a fixed seed */
function withSeed(seed,fn){const orig=Math.random;Math.random=mulberry(seed);try{return fn();}finally{Math.random=orig;}}
const BANKS={};
function buildTopicBank(u){
  const U=getU(u);const keys=new Set();const out=[];
  U.sets.forEach((set,lvl)=>set.forEach(spec=>{const q=TPL[spec[0]].b(...spec.slice(1));keys.add(q.key);out.push({u,lvl,tpl:spec[0],args:spec.slice(1),key:q.key});}));
    for(let lvl=0;lvl<3;lvl++){let need=LV_QUOTA[lvl]-U.sets[lvl].length,tries=0;const slots=U.sets[lvl];
    while(need>0&&tries++<4000){const spec=slots[tries%slots.length];const t=TPL[spec[0]];
      try{const a=(t.rv?t.rv(...spec.slice(1)):t.r());const q=t.b(...a);if(q&&q.key&&!keys.has(q.key)){keys.add(q.key);out.push({u,lvl,tpl:spec[0],args:a,key:q.key});need--;}}catch(e){}}}
  return out;}
/* ---- difficulty: every bank gets a deterministic total order (rank 1 = easiest ... 100 = hardest).
   Primary key = the authored level (easy / medium / hard); secondary key = a "fine" score computed from the question's features. ---- */
function fineScore(q,e){let f=0;const k=q.kind;
  f+=k==='mc'?(q.tf?0:1):k==='tap'?1.4:k==='drag'?2:k==='num'?1.6+.5*((q.nf||1)-1):k==='multi'?3.2:1.5;
  if(q.neg)f+=.5;
  if(k==='multi')f+=.35*(q.options||[]).filter(o=>o.correct).length+.1*(q.options||[]).length;else if(q.options)f+=.1*q.options.length;
  const b=q.board;if(b){if((b.ux||1)>1||(b.uy||1)>1)f+=.8;if(b.nums===false)f+=1.2;if((b.lx||1)>1||(b.ly||1)>1)f+=.4;if(b.qx!=null||b.qy!=null)f+=.4;}
  const sp=q.angle;if(sp){f+=.35*sp.arcs.length+.1*Object.keys(sp.pts).length;if(sp.meta&&sp.meta.extra)f+=.6*Object.keys(sp.meta.extra).length;}
  f+=Math.min(1.5,String(q.prompt||'').replace(/<[^>]+>/g,'').length/160);
  if(/twoPos|estim|unl|Composed|wholeNames|notName|sameTwo|eqMulti|nameMulti|sumMiss|Multi$/.test(e.tpl))f+=1;
  return f+(hashStr(e.key)%1000)/1e5;}
function rankBank(arr){
  arr.forEach(e=>{let q=null;try{q=makeQ(e);}catch(x){}e.fine=q?fineScore(q,e):99;});
  const sorted=arr.slice().sort((x,y)=>x.lvl-y.lvl||x.fine-y.fine||hashStr(x.key)-hashStr(y.key));
  sorted.forEach((e,i)=>{e.rank=i+1;});return sorted;}
/* the final exam (topic 9): 100 questions taken evenly from the 8 coordinate topics (same 33/34/33 split, spread across each topic's difficulty range) */
function buildExamBank(){
  const src=UNITS.slice(0,8).map(x=>getBank(x.id));const used=new Set();const out=[];
  for(let lvl=0;lvl<3;lvl++){const lists=src.map(b=>b.filter(e=>e.lvl===lvl));const quota=LV_QUOTA[lvl];
    const base=Math.floor(quota/lists.length),extra=quota-base*lists.length;
    const order=lists.map((_,i)=>i).sort((i,j)=>hashStr('exam'+lvl+i)-hashStr('exam'+lvl+j));
    order.forEach((ui,pos)=>{const L=lists[ui];const cnt=base+(pos<extra?1:0);
      for(let k=0;k<cnt;k++){let idx=cnt>1?Math.round(k*(L.length-1)/(cnt-1)):Math.floor(L.length/2);let tries=0;
        while(tries<L.length&&(used.has(L[(idx+tries)%L.length].key)))tries++;
        const e=L[(idx+tries)%L.length];if(e&&!used.has(e.key)){used.add(e.key);out.push(Object.assign({},e));}}});}
  return rankBank(out);}
function getBank(u){
  if(BANKS[u])return BANKS[u];
  if(u===9){BANKS[9]=buildExamBank();return BANKS[9];}

let CONF_ID=0,CONF_T=null;
function stopConfetti(){CONF_ID++;clearTimeout(CONF_T);const c=$('#confetti');c.getContext('2d').clearRect(0,0,c.width,c.height);c.style.display='none';}
function confetti(dur=3800,count=200){
  const my=++CONF_ID;const c=$('#confetti');c.width=innerWidth;c.height=innerHeight;c.style.display='block';const ctx=c.getContext('2d');
  const cols=['#ff4d6d','#3a86ff','#ffbe0b','#2ec4b6','#8338ec','#fb8500','#ff70a6'];
  const ps=Array.from({length:count},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:6+Math.random()*8,a:Math.random()*6,va:(Math.random()-.5)*.3,col:pick(cols),star:Math.random()<.35}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.col;
      if(p.star){ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?p.s*.45:p.s;const an=i*Math.PI/5;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r);}ctx.closePath();ctx.fill();}
      else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(my!==CONF_ID)return;if(t-t0<dur)requestAnimationFrame(f);else{ctx.clearRect(0,0,c.width,c.height);c.style.display='none';}})(t0);
}

        if(typeof r.best!=='number'){const sets=Array.isArray(r.sets)?r.sets:[];const bs=sets.map(s=>s&&typeof s.best==='number'?s.best:null);let m=-1;

      SAVE.ver=3;

    Object.keys(SAVE.units).forEach(u=>{const r=SAVE.units[u];if(!r||typeof r!=='object')return;
      if(!Array.isArray(r.sg)){const m=Math.max(0,Math.min(7,Math.floor(+r.mast)||0));r.sg=Array.from({length:13},(_,i)=>i<m?1:0);}

const HEB_ART=["בשנים האחרונות הנייד החכם הפך למוצר נפוץ ביותר בקרב בני נוער. כיום קשה למצוא מתבגרים הצועדים ברחוב ללא מכשיר חכם בידם. השימוש במכשירים אלו אינו מוגבל לשעות אחר הצהריים בלבד, אלא חודר אף אל תוך כותלי בית הספר. עובדה זו מעוררת דיון סוער בקרב אנשי חינוך, הורים ותלמידים כאחד.", "מצד אחד, יש המוצאים יתרונות רבים בשילוב הטלפון החכם בלמידה. טענתם היא כי המכשיר מאפשר גישה מהירה למאגרי מידע, להקנות מיומנויות חקר עצמאיות ולהפוך את השיעור לדינמי וחווייתי. כדי להמחיש זאת, מורים רבים משלבים בשיעוריהם חידונים מקוונים ועבודה קבוצתית. לטענתם, שימוש כזה מביא לתוצאה מיטבית בלמידה ומעלה את המוטיבציה של התלמידים.", "מן הצד השני, מומחים מזהירים מפני הסכנות והחיסרונות. תלמידים מוסחים בקלות מהשיעור, משיבים על מסרון שנשלח אליהם באמצע ההסבר או משחקים במשחקים רשתיים. יתרה מזאת, תופעת החרם והבריונות ברשת גולשת ישירות לכיתות הלימוד. מקצתם של המורים מדווחים כי הבעיה קשה עד כדי כך, שנעשה ניסיון להטיל אכיפה נוקשה על הוראות משרד החינוך: מכשיר שיופעל בזמן שיעור יוחרם לאלתר ויוחזר רק להורי התלמיד.", "הדעות בקרב ציבור ההורים חלוקות אף הן. חלקם מהססים אם לתמוך באיסור הגורף; הם חוששים מהעדר קשר רציף עם ילדיהם ומכך שהאיסור אינו מציאותי. תמונת המצב המצטיירת היא עגומה למדי, שכן ניכר כי אין הסכמה רחבה. מציאות זו מציבה אתגר מורכב במיוחד בפני מנהלי בתי הספר והצוותים החינוכיים, המנסים למצוא את איזון הזהב.", "מתוך הדברים, משתמעת אמירה שאינה משתמעת לשתי פנים: הטלפון החכם נמצא כאן כדי להישאר, ולא ניתן להתעלם מקיומו. השאלה אינה אם לאסור את השימוש בו לחלוטין, אלא כיצד לחנך לשימוש מושכל. המלצה מרכזית של מומחי חינוך היא להגדיר יחד עם התלמידים שהות קבועה ומוגדרת מראש לשימוש במכשיר (למשל, בהפסקות בלבד או בחלק מסוים מהשיעור). גישה כזו תאפשר לתלמידים ליהנות מהמכשיר עמו או עמה (עם חבריהם וחברותיהם), מבלי לפגוע ברצף הלמידה ובאווירה הלימודית בכיתה."];

xt x=\"140\" y=\"100\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\">מסמר ברזל</text>\n<path d=\"M160 65 H200 V45 M120 120 H215 V45\" stroke=\"#e85d04\" stroke-width=\"3\" fill=\"none\"/>\n<circle cx=\"207\" cy=\"32\" r=\"16\" fill=\"#ffd60a\" stroke=\"#495057\" stroke-width=\"2\"/></svg>", "o": ["הנורה תדלק – ברזל מוליך חשמל", "הנורה לא תדלק – ברזל מבודד", "הסוללה תתפוצץ", "המסמר יימס"], "h": "האם מתכת מעבירה זרם?", "x": "המעגל סגור ע״י מוליך (ברזל), ולכן הזרם זורם והנורה דולקת."}, {"id": "s3_2", "k": "c", "p": "שמו כפית בכוס מים חמים, ואחרי 2 דקות <b>הכפית התחממה</b> (גם הקצה שבחוץ). למה?", "o": ["הכפית מוליכה חום – החום עבר מהמים לאורך הכפית", "הכפית ייצרה חום", "הכפית קיררה את המים לגמרי", "האוויר חימם את הכפית"], "h": "מה עבר מהמים לכפית?", "x": "החום עבר מהמים החמים אל הכפית ולאורכה – כי החומר שלה מוליך חום."}, {"id": "s3_3", "k": "k", "p": "לפי הניסוי (הכפית התחממה מהר) – מאיזה חומר <b>כנראה</b> עשויה הכפית?", "o": ["מתכת", "עץ", "פלסטיק", "קרטון"], "h": "איזה חומר מוליך חום טוב?", "x": "מתכות מוליכות חום היטב. כפית עץ או פלסטיק כמעט לא הייתה מתחממת בקצה העליון."}, {"id": "s3_4", "k": "r", "p": "בניסוי הכפית במים החמים – <b>באיזו תכונה</b> מדובר?", "o": ["מוליכות חום", "מוליכות חשמל", "שקיפות", "גמישות"], "h": "מה עבר בכפית – חום או חשמל?", "x": "מדובר במוליכות חום – הכפית העבירה את החום מהמים."}, {"id": "s4_1", "k": "r", "p": "מהם שלושת <b>מצבי הצבירה</b>?", "o": ["מוצק, נוזל, גז", "קר, חם, פושר", "כבד, קל, בינוני", "עץ, מתכת, פלסטיק"], "h": "קרח, מים, אדים.", "x": "שלושת מצבי הצבירה: מוצק, נוזל וגז."}, {"id": "s4_2", "k": "d", "p": "איזה מצב צבירה מתאר את הציור? החומר שומר על <b>צורה קבועה</b>.<svg class=\"scisvg\" viewBox=\"0 0 130 140\" width=\"120\" height=\"130\" aria-hidden=\"true\"><rect x=\"20\" y=\"20\" width=\"90\" height=\"110\" rx=\"6\" fill=\"none\" stroke=\"#495057\" stroke-width=\"3\"/><rect x=\"40\" y=\"70\" width=\"50\" height=\"50\" fill=\"#8d6e63\"/></svg>", "o": ["מוצק", "נוזל", "גז", "אין לו מצב צבירה"], "h": "האם הוא מקבל : "r", "p": "מהי <b>יחידת המידה</b> של מסה?", "o": ["גרם / קילוגרם", "מטר / סנטימטר", "ליטר / מיליליטר", "מעלות צלזיוס"], "h": "במה קונים תפוחים בשוק?", "x": "מודדים מסה ביחידות גרם (ג׳) וקילוגרם (ק״ג). 1 ק״ג = 1,000 גרם."}, {"id": "s6_1", "k": "s", "p": "ליאת מדדה מסה של <b>תפוח</b>. היא התאזנה עם <b>4 אבני מסה של 5 גרם</b> כל אחת. מה מסת התפוח?<svg class=\"scisvg\" viewBox=\"0 0 260 150\" width=\"260\" height=\"150\" aria-hidden=\"true\">\n<rect x=\"120\" y=\"128\" width=\"20\" height=\"10\" rx=\"3\" fill=\"#8d99ae\"/><rect x=\"70\" y=\"136\" width=\"120\" height=\"8\" rx=\"4\" fill=\"#5c677d\"/>\n<rect x=\"126\" y=\"40\" width=\"8\" height=\"90\" fill=\"#5c677d\"/><polygon points=\"130,32 122,44 138,44\" fill=\"#5c677d\"/>\n<g transform=\"rotate(0 130 40)\"><rect x=\"40\" y=\"37\" width=\"180\" height=\"6\" rx=\"3\" fill=\"#3a86ff\"/>\n<g transform=\"rotate(0 50 40)\"><line x1=\"50\" y1=\"40\" x2=\"30\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"50\" y1=\"40\" x2=\"70\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M22 88 Q50 104 78 88Z\" fill=\"#ffbe0b\"/><text x=\"50\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">🍎</text><text x=\"50\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">תפוח</text></g>\n<g transform=\"rotate(0 210 40)\"><line x1=\"210\" y1=\"40\" x2=\"190\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"210\" y1=\"40\" x2=\"230\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M182 88 Q210 104 238 88Z\" fill=\"#ffbe0b\"/><text x=\"210\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">⚖️</text><text x=\"210\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">4 × 5 ג׳</text></g></g></svg>", "o": ["20 גרם", "9 גרם", "5 גרם", "45 גרם"], "h": "כמה זה 4 פעמים 5?", "x": "כשהמאזניים מאוזנים – המסות שוות: 4 × 5 = 20 גרם.", "gen": "apple"}, {"id": "s6_2", "k": "r", "p": "כאשר כפות המאזניים <b>מאוזנות</b> – מה זה אומר?<svg class=\"scisvg\" viewBox=\"0 0 260 150\" width=\"260\" height=\"150\" aria-hidden=\"true\">\n<rect x=\"120\" y=\"128\" width=\"20\" height=\"10\" rx=\"3\" fill=\"#8d99ae\"/><rect x=\"70\" y=\"136\" width=\"120\" height=\"8\" rx=\"4\" fill=\"#5c677d\"/>\n<rect x=\"126\" y=\"40\" width=\"8\" height=\"90\" fill=\"#5c677d\"/><polygon points=\"130,32 122,44 138,44\" fill=\"#5c677d\"/>\n<g transform=\"rotate(0 130 40)\"><rect x=\"40\" y=\"37\" width=\"180\" height=\"6\" rx=\"3\" fill=\"#3a86ff\"/>\n<g transform=\"rotate(0 50 40)\"><line x1=\"50\" y1=\"40\" x2=\"30\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"50\" y1=\"40\" x2=\"70\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M22 88 Q50 104 78 88Z\" fill=\"#ffbe0b\"/><text x=\"50\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">📦</text><text x=\"50\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\"></text></g>\n<g transform=\"rotate(0 210 40)\"><line x1=\"210\" y1=\"40\" x2=\"190\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"210\" y1=\"40\" x2=\"230\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M182 88 Q210 104 238 88Z\" fill=\"#ffbe0b\"/><text x=\"210\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">🧱</text><text x=\"210\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\"></text></g></g></svg>", "o": ["המסות בשתי הכפות שוות", "בכף אחת יש מסה גדולה יותר", "המאזניים מקולקלים", "אין כלום בכפות"], "h": "מאוזן = שווה.", "x": "מאזניים מאוזנים = המסות בשתי הכפות שוות."}, {"id": "s6_3", "k": "r", "p": "כאשר כפות המאזניים <b>אינן מאוזנות</b> – מה זה אומר?<svg class=\"scisvg\" viewBox=\"0 0 260 150\" width=\"260\" height=\"150\" aria-hidden=\"true\">\n<rect x=\"120\" y=\"128\" width=\"20\" height=\"10\" rx=\"3\" fill=\"#8d99ae\"/><rect x=\"70\" y=\"136\" width=\"120\" height=\"8\" rx=\"4\" fill=\"#5c677d\"/>\n<rect x=\"126\" y=\"40\" width=\"8\" height=\"90\" fill=\"#5c677d\"/><polygon points=\"130,32 122,44 138,44\" fill=\"#5c677d\"/>\n<g transform=\"rotate(-12 130 40)\"><rect x=\"40\" y=\"37\" width=\"180\" height=\"6\" rx=\"3\" fill=\"#3a86ff\"/>\n<g transform=\"rotate(12 50 40)\"><line x1=\"50\" y1=\"40\" x2=\"30\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"50\" y1=\"40\" x2=\"70\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M22 88 Q50 104 78 88Z\" fill=\"#ffbe0b\"/><text x=\"50\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">📦</text><text x=\"50\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\"></text></g>\n<g transform=\"rotate(12 210 40)\"><line x1=\"210\" y1=\"40\" x2=\"190\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"210\" y1=\"40\" x2=\"230\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M182 88 Q210 104 238 88Z\" fill=\"#ffbe0b\"/><text x=\"210\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">🧱</text><text x=\"210\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\"></text></g></g></svg>", "o": ["המסות שונות – בכף הנמוכה יש מסה גדולה יותר", "המסות שוות", "בכף הגבוהה יש מסה גדולה יותר", "המאזניים מאוזנים"], "h": "איזו כף ירדה?", "x": "כשהמאזניים לא מאוזנים, המסות לא שוות: הכף שירדה למטה מכילה את המסה הגדולה יותר."}, {"id": "s6_4", "k": "d", "p": "הסתכל על המאזניים: <b>הכף עם הספר</b> ירדה למטה. מה נכון?<svg class=\"scisvg\" viewBox=\"0 0 260 150\" width=\"260\" height=\"150\" aria-hidden=\"true\">\n<rect x=\"120\" y=\"128\" width=\"20\" height=\"10\" rx=\"3\" fill=\"#8d99ae\"/><rect x=\"70\" y=\"136\" width=\"120\" height=\"8\" rx=\"4\" fill=\"#5c677d\"/>\n<rect x=\"126\" y=\"40\" width=\"8\" height=\"90\" fill=\"#5c677d\"/><polygon points=\"130,32 122,44 138,44\" fill=\"#5c677d\"/>\n<g transform=\"rotate(-12 130 40)\"><rect x=\"40\" y=\"37\" width=\"180\" height=\"6\" rx=\"3\" fill=\"#3a86ff\"/>\n<g transform=\"rotate(12 50 40)\"><line x1=\"50\" y1=\"40\" x2=\"30\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"50\" y1=\"40\" x2=\"70\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M22 88 Q50 104 78 88Z\" fill=\"#ffbe0b\"/><text x=\"50\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">📕</text><text x=\"50\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">ספר</text></g>\n<g transform=\"rotate(12 210 40)\"><line x1=\"210\" y1=\"40\" x2=\"190\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"210\" y1=\"40\" x2=\"230\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M182 88 Q210 104 238 88Z\" fill=\"#ffbe0b\"/><text x=\"210\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">✏️</text><text x=\"210\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">עיפרון</text></g></g></svg>", "o": ["למסה של הספר יש יותר מהמסה של העיפרון", "לעיפרון יש מסה גדולה יותר", "המסות שוות", "לספר אין מסה"], "h": "הכף הנמוכה – הכבדה.", "x": "הכף שירדה מחזיקה את המסה הגדולה יותר – הספר."}, {"id": "s6_9", "k": "m", "p": "עומר שם <b>תיק גדול</b> מול <b>אבן קטנה</b> ואמר: „בטוח שהתיק ירד – הוא הכי גדול.” מה הטעות?", "o": ["גודל לא קובע מסה – צריך לבדוק במאזניים", "אין טעות – גדול תמיד כבד יותר", "האבן תמיד יורדת", "המאזניים לא מודדים מסה"], "h": "זוכר את הקופסה עם הנוצות?", "x": "תיק גדול יכול להיות ריק וקל. מה שקובע הוא כמות החומר (מסה), ובודקים זאת במאזניים."}, {"id": "s0_4", "k": "k", "p": "בצירוף <b>„מסמר פלדה”</b> – מה הגוף?", "o": ["מסמר", "פלדה", "שניהם", "אף אחד מהם"], "h": "הגוף הוא החפץ שאפשר להחזיק ביד ויש לו צורה.", "x": "המסמר הוא הגוף, הפלדה (סוג של מתכת) היא החומר."}, {"id": "s0_11", "k": "m", "p": "דנה אמרה: „<b>מים</b> הם גוף, כי הם נמצאים בתוך כוס.” מה נכון?", "o": ["מים הם חומר; הכוס היא הגוף", "מים הם גוף, הכוס היא חומר", "גם המים וגם הכוס הם חומרים", "מים הם גוף רק כשהם קפואים"], "h": "למים אין צורה קבועה משלהם.", "x": "המים הם חומר. הכוס היא גוף. (גם קוביית קרח היא גוף שעשוי מהחומר מים.)"}, {"id": "s1_10", "k": "k", "p": "מה משותף ל<b>מסמר, מפתח ופחית</b>?", "o": ["כולם עשויים מתכת", "כולם עשויים פלסטיק", "כולם חומרים", "כולם שקופים"], "h": "הם מבריקים וקשים.", "x": "שלושתם גופים שעשויים מסוגים שונים של מתכת."}, {"id": "s2_9", "k": "d", "p": "אותו מעגל, אבל במקום המסמר שמו <b>סרגל פלסטיק</b>. מה יקרה?<svg class=\"scisvg\" viewBox=\"0 0 260 140\" width=\"260\" height=\"140\" aria-hidden=\"true\">\n<rect x=\"20\" y=\"50\" width=\"50\" height=\"30\" rx=\"5\" fill=\"#495057\"/><rect x=\"70\" y=\"58\" width=\"6\" height=\"14\" fill=\"#495057\"/><text x=\"45\" y=\"70\" fill=\"#fff\" font-size=\"12\" text-anchor=\"middle\">סוללה</text>\n<path d=\"M73 65 H120 M45 80 V120 H120\" stroke=\"#e85d04\" stroke-width=\"3\" fill=\"none\"/>\n<rect x=\"120\" y=\"55\" width=\"40\" height=\"20\" rx=\"4\" fill=\"#adb5bd\"/><text x=\"140\" y=\"100\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\">סרגל פלסטיק</text>\n<path d=\"M160 65 H200 V45 M120 120 H215 V45\" stroke=\"#e85d04\" stroke-width=\"3\" fill=\"none\"/>\n<circle cx=\"207\" cy=\"32\" r=\"16\" fill=\"#e9ecef\" stroke=\"#495057\" stroke-width=\"2\"/></svg>", "o": ["הנורה לא תדלק – פלסטיק מבודד", "הנורה תדלק חזק יותר", "הנורה תדלק חלש", "הסרגל יתחמם ויאיר"], "h": "פלסטיק – מוליך או מבודד?", "x": "פלסטיק מבודד, הזרם לא עובר והנורה לא נדלקת. כך אפשר לבדוק אם חומר מוליך."}, {"id": "s3_6", "k": "s", "p": "למה <b>ידיות של סירים</b> עשויות לעתים קרובות מפלסטיק או מעץ?", "o": ["כי הם מבודדי חום – הידית לא תתחמם ולא נכווה", "כי הם מוליכי חום טובים", "כי הם יפים יותר", "כי הם מוליכים חשמל"], "h": "מה רוצים שיקרה לידית כשהסיר על האש?", "x": "פלסטיק ועץ מבודדים חום, כך אפשר להחזיק את הסיר בלי להיכוות."}, {"id": "s4_4", "k": "d", "p": "החומר בציור <b>ממלא את כל הכלי</b>. מה מצב הצבירה שלו?<svg class=\"scisvg\" viewBox=\"0 0 130 140\" width=\"120\" height=\"130\" aria-hidden=\"true\"><rect x=\"20\" y=\"20\" width=\"90\" height=\"110\" rx=\"6\" fill=\"none\" stroke=\"#495057\" stroke-width=\"3\"/><circle cx=\"35\" cy=\"40\" r=\"4\" fill=\"#adb5bd\"/><circle cx=\"70\" cy=\"30\" r=\"4\" fill=\"#adb5bd\"/><circle cx=\"95\" cy=\"55\" r=\"4\" fill=\"#adb5bd\"/><circle cx=\"45\" cy=\"80\" r=\"4\" fill=\"#adb5bd\"/><circle cx=\"80\" cy=\"95\" r=\"4\" fill=\"#adb5bd\"/><circle cx=\"30\" cy=\"115\" r=\"4\" fill=\"#adb5bd\"/><circle cx=\"100\" cy=\"118\" r=\"4\" fill=\"#adb5bd\"/><circle cx=\"60\" cy=\"60\" r=\"4\" fill=\"#adb5bd\"/></svg>", "o": ["גז", "נוזל", "מוצק", "אי אפשר לדעת"], "h": "מה קורה לריח של בושם בחדר?", "x": "גז ממלא את כל הכלי שבו הוא נמצא – אין לו צורה קבועה ולא נפח קבוע."}, {"id": "s5_3", "k": "k", "p": "איזו יחידה <b>לא</b> מתאימה למדידת מסה?", "o": ["ליטר", "גרם", "קילוגרם", "טון"], "h": "שלוש מהן מודדות כמות חומר, ואחת מודדת נפח.", "x": "ליטר הוא יחידה של נפח. גרם, קילוגרם וטון הן יחידות מסה."}, {"id": "s5_10", "k": "c", "p": "לשתי קופסאות <b>אותו גודל</b>, אבל אחת מלאה <b>חול</b> ואחת <b>נוצות</b>. לאיזו מסה גדולה יותר?", "o": ["לקופסת החול – יש בה יותר חומר", "לקופסת הנוצות", "שתיהן שוות כי הגודל שווה", "אי אפשר לדעת"], "h": "גודל שווה לא אומר מסה שווה.", "x": "מסה היא כמות החומר, לא הגודל. בקופסת החול דחוס הרבה יותר חומר."}, {"id": "s6_5", "k": "d", "p": "המאזניים בציור <b>מאוזנים</b>: בצד אחד תפוז, בצד השני <b>אבנים של 50, 50 ו-20 גרם</b>. מה מסת התפוז?<svg class=\"scisvg\" viewBox=\"0 0 260 150\" width=\"260\" height=\"150\" aria-hidden=\"true\">\n<rect x=\"120\" y=\"128\" width=\"20\" height=\"10\" rx=\"3\" fill=\"#8d99ae\"/><rect x=\"70\" y=\"136\" width=\"120\" height=\"8\" rx=\"4\" fill=\"#5c677d\"/>\n<rect x=\"126\" y=\"40\" width=\"8\" height=\"90\" fill=\"#5c677d\"/><polygon points=\"130,32 122,44 138,44\" fill=\"#5c677d\"/>\n<g transform=\"rotate(0 130 40)\"><rect x=\"40\" y=\"37\" width=\"180\" height=\"6\" rx=\"3\" fill=\"#3a86ff\"/>\n<g transform=\"rotate(0 50 40)\"><line x1=\"50\" y1=\"40\" x2=\"30\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"50\" y1=\"40\" x2=\"70\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M22 88 Q50 104 78 88Z\" fill=\"#ffbe0b\"/><text x=\"50\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">🍊</text><text x=\"50\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">תפוז</text></g>\n<g transform=\"rotate(0 210 40)\"><line x1=\"210\" y1=\"40\" x2=\"190\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"210\" y1=\"40\" x2=\"230\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M182 88 Q210 104 238 88Z\" fill=\"#ffbe0b\"/><text x=\"210\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">⚖️</text><text x=\"210\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">50+50+20 ג׳</text></g></g></svg>", "o": ["120 גרם", "100 גרם", "70 גרם", "50 גרם"], "h": "חבר את כל המסות שבכף השנייה.", "x": "מאוזן ⇒ שווה: 50 + 50 + 20 = 120 גרם.", "gen": "orange"}, {"id": "s6_6", "k": "s", "p": "בכף אחת עגבנייה, בשנייה אבן של <b>100 גרם</b>. הכף עם <b>האבן</b> ירדה. מה נכון?<svg class=\"scisvg\" viewBox=\"0 0 260 150\" width=\"260\" height=\"150\" aria-hidden=\"true\">\n<rect x=\"120\" y=\"128\" width=\"20\" height=\"10\" rx=\"3\" fill=\"#8d99ae\"/><rect x=\"70\" y=\"136\" width=\"120\" height=\"8\" rx=\"4\" fill=\"#5c677d\"/>\n<rect x=\"126\" y=\"40\" width=\"8\" height=\"90\" fill=\"#5c677d\"/><polygon points=\"130,32 122,44 138,44\" fill=\"#5c677d\"/>\n<g transform=\"rotate(12 130 40)\"><rect x=\"40\" y=\"37\" width=\"180\" height=\"6\" rx=\"3\" fill=\"#3a86ff\"/>\n<g transform=\"rotate(-12 50 40)\"><line x1=\"50\" y1=\"40\" x2=\"30\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"50\" y1=\"40\" x2=\"70\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M22 88 Q50 104 78 88Z\" fill=\"#ffbe0b\"/><text x=\"50\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">🍅</text><text x=\"50\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">עגבנייה</text></g>\n<g transform=\"rotate(-12 210 40)\"><line x1=\"210\" y1=\"40\" x2=\"190\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><line x1=\"210\" y1=\"40\" x2=\"230\" y2=\"88\" stroke=\"#5c677d\" stroke-width=\"2\"/><path d=\"M182 88 Q210 104 238 88Z\" fill=\"#ffbe0b\"/><text x=\"210\" y=\"82\" font-size=\"22\" text-anchor=\"middle\">⚖️</text><text x=\"210\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">100 ג׳</text></g></g></svg>", "o": ["מסת העגבנייה קטנה מ-100 גרם", "מסת העגבנייה גדולה מ-100 גרם", "מסת העגבנייה בדיוק 100 גרם", "לא ניתן לדעת כלום"], "h": "איזה צד כבד יותר?", "x": "הכף של האבן נמוכה ⇒ האבן כבדה יותר, ולכן העגבנייה פחות מ-100 גרם."}, {"id": "s0_9", "k": "k", "p": "באיזו רשימה מופיעים <b>רק חומרים</b>?", "o": ["עץ, ברזל, זכוכית, מים", "עץ, שולחן, זכוכית, כוס", "מסמר, פלדה, כוס, מים", "בקבוק, ספר, עפרון, כדור"], "h": "חומרים עונים על „ממה זה עשוי?”", "x": "עץ, ברזל, זכוכית ומים הם חומרים. שולחן, כוס, מסמר ובקבוק הם גופים."}, {"id": "s0_12", "k": "s", "p": "מאותו חומר – <b>עץ</b> – אפשר לבנות כמה גופים. מה מהבאים <b>לא</b> נכון?", "o": ["כל גוף עשוי תמיד מחומר אחד בלבד", "מעץ אפשר לבנות כיסא, שולחן וגם עיפרון", "גוף אחד יכול להיות עשוי מכמה חומרים", "אותו גוף (כמו כיסא) יכול להיות עשוי מחומרים שונים"], "h": "חשוב על עיפרון: יש בו עץ ויש בו גם עופרת (גרפיט).", "x": "גוף יכול להיות עשוי מכמה חומרים (עיפרון = עץ + גרפיט), ומחומר אחד אפשר לבנות הרבה גופים."}, {"id": "s1_7", "k": "w", "p": "מה היה קורה אם היו מכינים <b>סיר בישול</b> מפלסטיק רגיל?", "o": ["הוא היה נמס או מתעוות על האש", "הוא היה מתבשל מהר יותר", "שום דבר – אין הבדל", "הוא היה הופך לזכוכית"], "h": "מה קורה לפלסטיק רגיל ליד חום גבוה?", "x": "סיר עשוי מתכת כי היא עמידה בחום ומוליכה חום טוב. פלסטיק רגיל נמס בחום גבוה."}, {"id": "s2_10", "k": "d", "p": "במעגל הבדיקה שמו <b>חוד של עיפרון</b> (גרפיט) והנורה נדלקה. מה אפשר להסיק?<svg class=\"scisvg\" viewBox=\"0 0 260 140\" width=\"260\" height=\"140\" aria-hidden=\"true\"><g stroke=\"#ffb703\" stroke-width=\"3\"><line x1=\"200\" y1=\"10\" x2=\"200\" y2=\"0\"/><line x1=\"222\" y1=\"18\" x2=\"230\" y2=\"10\"/><line x1=\"178\" y1=\"18\" x2=\"170\" y2=\"10\"/></g>\n<rect x=\"20\" y=\"50\" width=\"50\" height=\"30\" rx=\"5\" fill=\"#495057\"/><rect x=\"70\" y=\"58\" width=\"6\" height=\"14\" fill=\"#495057\"/><text x=\"45\" y=\"70\" fill=\"#fff\" font-size=\"12\" text-anchor=\"middle\">סוללה</text>\n<path d=\"M73 65 H120 M45 80 V120 H120\" stroke=\"#e85d04\" stroke-width=\"3\" fill=\"none\"/>\n<rect x=\"120\" y=\"55\" width=\"40\" height=\"20\" rx=\"4\" fill=\"#adb5bd\"/><text x=\"140\" y=\"100\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\">גרפיט</text>\n<path d=\"M160 65 H200 V45 M120 120 H215 V45\" stroke=\"#e85d04\" stroke-width=\"3\" fill=\"none\"/>\n<circle cx=\"207\" cy=\"32\" r=\"16\" fill=\"#ffd60a\" stroke=\"#495057\" stroke-width=\"2\"/></svg>", "o": ["גרפיט מוליך חשמל", "גרפיט הוא מתכת", "גרפיט מבודד", "הנורה מקולקלת"], "h": "הנורה דולקת רק כשהזרם עובר.", "x": "גרפיט מוליך חשמל למרות שהוא לא מתכת. (הנורה עשויה לדלוק חלש – הוא מוליך פחות טוב ממתכת.)"}, {"id": "s2_11", "k": "c", "p": "למה חוטי חשמל עשויים <b>נחושת בפנים</b> ו<b>פלסטיק מבחוץ</b>?", "o": ["הנחושת מעבירה את הזרם, והפלסטיק מגן עלינו מפני מכת חשמל", "הנחושת מגינה, והפלסטיק מעביר את הזרם", "שניהם מעבירים זרם", "הפלסטיק נותן צבע בלבד"], "h": "לכל חומר יש תפקיד אחר.", "x": "נחושת – מוליך טוב שמעביר זרם. פלסטיק – מבודד שעוטף ומגן."}, {"id": "s2_14", "k": "m", "p": "עדי כתבה: „כל חומר <b>קשה</b> מוליך חשמל.” איזו דוגמה מראה שהיא טועה?", "o": ["זכוכית – קשה, אבל מבודדת", "ברזל – קשה ומוליך", "נחושת – מוליכה", "אלומיניום – מוליך"], "h": "חפש חומר קשה שלא מעביר חשמל.", "x": "קשיות לא קובעת מוליכות: זכוכית קשה מאוד ובכל זאת מבודדת."}, {"id": "s3_9", "k": "c", "p": "בבוקר נוגעים במעקה <b>ברזל</b> ובספסל <b>עץ</b> שעומדים באותו מקום. הברזל <b>מרגיש</b> קר יותר. למה?", "o": ["הברזל מוליך חום טוב ומושך חום מהיד מהר", "הברזל באמת הרבה יותר קר מהעץ", "העץ מייצר חום", "הברזל מבודד חום"], "h": "שניהם עמדו באותו מקום כל הלילה – הטמפרטורה שלהם דומה.", "x": "שניהם באותה טמפרטורה, אבל הברזל מעביר את החום מהיד מהר יותר – ולכן מרגיש קר יותר."}, {"id": "s3_12", "k": "k", "p": "איזה זוג מתאים: <b>מוליך חום</b> – <b>מבודד חום</b>?", "o": ["אלומיניום – צמר", "צמר – אלומיניום", "עץ – פלסטיק", "ברזל – נחושת"], "h": "מתכת ראשונה.", "x": "אלומיניום (מתכת) מוליך חום; צמר מבודד חום."}, {"id": "s4_9", "k": "c", "p": "שמים סיר מים על האש ורואים <b>אדים</b> עולים. מה קרה?", "o": ["המים התאדו – הפכו מנוזל לגז (אדי מים)", "המים הפכו למוצק", "המים נעלמו ואינם קיימים יותר", "האש יצרה חומר חדש"], "h": "החום משנה את מצב הצבירה.", "x": "בחימום המים מתאדים והופכים לאדי מים (גז). אדי המים עצמם שקופים; ה„ענן” הלבן שרואים הוא טיפות זעירות שהתעבו באוויר הקר."}, {"id": "s4_13", "k": "k", "p": "מה <b>שונה</b> בין <b>נוזל</b> לבין <b>גז</b>?", "o": ["נוזל שומר על נפח קבוע, גז מתפשט וממלא את כל הכלי", "לנוזל יש צורה קבועה ולגז אין", "גז שומר על נפח קבוע ונוזל לא", "אין הבדל"], "h": "חשוב על מים בכוס ועל ריח בחדר.", "x": "שניהם בלי צורה קבועה, אבל לנוזל יש נפח קבוע, ואילו גז ממלא את כל המקום שיש לו."}, {"id": "s5_7", "k": "w", "p": "לוקחים כדור <b>פלסטלינה</b> ומשטחים אותו לפיתה. מה קורה למסה?", "o": ["נשארת אותו דבר – לא הוסיפו ולא הורידו חומר", "גדלה, כי הפיתה רחבה יותר", "קטנה, כי הפיתה דקה", "נעלמת"], "h": "האם הוסיפו או הורידו פלסטלינה?", "x": "שינוי צורה לא משנה מסה – כמות החומר נשארת זהה."}, {"id": "s6_7", "k": "s", "p": "כדי לאזן את המאזניים, נוי צריכה <b>3 אבנים של 10 גרם</b> ו<b>אבן אחת של 5 גרם</b>. מה המסה של הגוף?", "o": ["35 גרם", "15 גרם", "30 גרם", "45 גרם"], "h": "3 × 10 ועוד 5.", "x": "3 × 10 = 30, ועוד 5 = 35 גרם."}, {"id": "s0_13", "k": "w", "p": "מה היה קורה אם היינו בונים <b>אותו כיסא</b> פעם מעץ ופעם מפלסטיק?", "o": ["זה עדיין אותו סוג של גוף (כיסא), רק עשוי מחומר אחר", "זה כבר לא היה כיסא", "הכיסא מפלסטיק היה הופך לחומר", "שני הכיסאות היו חייבים להיות באותו משקל"], "h": "מה משתנה – הגוף או החומר?", "x": "הגוף נשאר כיסא; רק החומר משתנה. לכן מתאימים חומר לשימוש (פלסטיק – קל ועמיד במים, עץ – חזק)."}, {"id": "s1_11", "k": "s", "p": "לבקבוקי שתייה משתמשים גם בזכוכית וגם בפלסטיק. מה <b>יתרון</b> הפלסטיק?", "o": ["הוא קל ולא נשבר בקלות", "הוא כבד יותר", "הוא שקוף יותר מזכוכית תמיד", "הוא מוליך חשמל"], "h": "מה קורה כשבקבוק נופל?", "x": "בקבוק פלסטיק קל ולא מתנפץ כשהוא נופל – לכן נוח לקחת אותו לטיול."}, {"id": "s2_13", "k": "s", "p": "למה אסור לגעת במכשירי חשמל <b>בידיים רטובות</b>?", "o": ["כי מים עם מלחים (כמו מי ברז וזיעה) מוליכים חשמל", "כי מים מבודדים חשמל", "כי המכשיר יתקרר", "אין סיבה – זה בטוח"], "h": "מים שבחיי היום-יום אינם טהורים – יש בהם מלחים מומסים.", "x": "מי ברז וזיעה מכילים מלחים ולכן מוליכים חשמל. ידיים רטובות מגדילות את הסכנה למכת חשמל."}, {"id": "s2_15", "k": "s", "p": "חשמלאים עובדים עם <b>מברג שידיתו מגומי או פלסטיק</b>. למה?", "o": ["כדי שהידית תבודד ותגן עליהם מפני זרם", "כדי שהמברג יהיה כבד", "כדי שהמברג ימגנט", "כדי שהברגים יסתובבו מהר"], "h": "איפה היד נוגעת?", "x": "הידית המבודדת מונעת מהזרם לעבור ליד, גם אם קצה המתכת נוגע בחוט חשמלי."}, {"id": "s3_5", "k": "w", "p": "מה היה קורה אם באותו ניסוי היו משתמשים ב<b>כפית עץ</b>?", "o": ["הקצה העליון כמעט לא היה מתחמם", "הכפית הייתה מתחממת מהר יותר", "המים היו רותחים", "הכפית הייתה נמסה"], "h": "עץ – מוליך חום טוב או מבודד?", "x": "עץ הוא מבודד חום, לכן הקצה העליון נשאר כמעט קר. בגלל זה מערבבים מרק בכף עץ."}, {"id": "s3_10", "k": "m", "p": "רון אמר: „מעיל חורף <b>מייצר חום</b> ולכן חם לי.” מה הטעות?", "o": ["המעיל לא מייצר חום – הוא מבודד ושומר על חום הגוף", "המעיל מוליך חום טוב", "אין טעות", "המעיל מייצר קור"], "h": "מאיפה מגיע החום?", "x": "החום מגיע מהגוף שלנו. המעיל מבודד חום ולא נותן לו לברוח החוצה."}, {"id": "s3_11", "k": "s", "p": "<b>תרמוס</b> שומר תה חם שעות. מה הסיבה העיקרית?", "o": ["הדפנות שלו בנויות לבודד חום – החום כמעט לא יוצא", "הוא מחמם את התה כל הזמן", "הוא עשוי ממוליך חום טוב", "יש בו סוללה"], "h": "האם בתרמוס יש גוף חימום?", "x": "התרמוס בנוי כך שהחום כמעט לא עובר דרך הדפנות – הוא מבודד."}, {"id": "s4_10", "k": "s", "p": "בבוקר קר רואים <b>טיפות</b> על החלק הפנימי של החלון. מאיפה הן?", "o": ["אדי מים מהאוויר התקררו ליד הזכוכית הקרה והפכו לנוזל", "המים חלחלו דרך הזכוכית", "הזכוכית נמסה", "אלה טיפות גשם מבחוץ"], "h": "גז שמתקרר יכול להפוך ל...", "x": "זה עיבוי: אדי מים (גז) מתקררים ליד חלון קר והופכים לטיפות (נוזל)."}, {"id": "s5_8", "k": "w", "p": "קוביית קרח של <b>20 גרם</b> נמסה בכוס סגורה. מה המסה של המים ש const SS_NAMES={m:['נועם','יואב','עומר','איתי','אורי','דניאל','אפרים','שלום','גיא','עידו'],f:['דנה','שירה','ליאת','נוי','מאיה','רותי','עדי','יעל','הילה']};
const ssEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
/* swap first names (same gender, so verbs stay correct) consistently in prompt, options, hint and explanation */
function ssNames(q){const txt=[q.p,q.h||'',q.x||''].concat(q.o).join(' ');const map={};
  ['m','f'].forEach(g=>{const L=SS_NAMES[g];const found=L.filter(n=>new RegExp('(^|[^\u05d0-\u05ea])[ולבהמש]?'+ssEsc(n)+'(?![\u05d0-\u05ea])').test(txt));
    const free=shuffle(L.filter(n=>!found.includes(n)&&n!=='שלום'));found.forEach((n,i)=>map[n]=free[i]);});
  const keys=Object.keys(map);if(!keys.length)return q;
  const re=new RegExp('(^|[^\u05d0-\u05ea])([ולבהמש]?)('+keys.map(ssEsc).join('|')+')(?![\u05d0-\u05ea])','g');const f=s=>s==null?s:s.replace(re,(m,a,b,n)=>a+b+map[n]);
  return Object.assign({},q,{p:f(q.p),h:f(q.h),x:f(q.x),o:q.o.map(f)});}

    const svg=(q.p.match(/<svg[\s\S]*<\/svg>/)||[''])[0].replace('🍎',fr[2]).replace('>תפוח<','>'+fr[1]+'<').replace('4 × 5 ג׳',`${n} × ${w} ג׳`);

   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn green" id="uSync">🔄 סנכרן עכשיו</button><button class="btn ghost" id="uOut">🚪 התנתק</button><button class="btn ghost" onclick="closeModal()">סגור</button></div>`);
  $('#uSync').onclick=async()=>{await cloudSyncFull();const l=$('#syncLine');if(l)l.textContent=SYNC_TXT[SYNC.state]||'';};
  $('#uOut').onclick=async()=>{try{await cloudPush();await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+AUTH.at}});}catch(e){}setAuth(null);SYNC.state='off';closeModal();modal(`<h2>התנתקת 👋</h2><p style="font-size:18px">ההתקדמות שמורה בענן ובמכשיר הזה. אפשר להתחבר שוב מתי שתרצה.</p><button class="btn green" onclick="closeModal()">אוקיי</button>`);};}
const GLOGO='<svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.2-8.5 2.2-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';
const APP_URL='https://vbuchatsky-source.github.io/adam/';
const escH=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function googleUrl(){const back=/^https?:$/.test(location.protocol)?location.origin+location.pathname:APP_URL;return SB_URL+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(back);}
function googleLogin(){try{localStorage.setItem(ASKED_KEY,'1');localStorage.setItem('adamGooglePending','1');}catch(e){}persist();location.assign(googleUrl());}
async function sbUser(at){const r=await fetch(SB_URL+'/auth/v1/user',{headers:{apikey:SB_KEY,Authorization:'Bearer '+at}});if(!r.ok)throw new Error('user '+r.status);return r.json();}
function profOf(u){const m=(u&&u.user_metadata)||{};return {name:m.full_name||m.name||'',pic:m.avatar_url||m.picture||'',prov:(u&&u.app_metadata&&u.app_metadata.provider)||''};}
/* return from Google: tokens arrive in the URL hash (implicit flow) */
async function handleOAuthReturn(){const h=location.hash||'';if(!/access_token=|error_description=/.test(h))return false;const P=new URLSearchParams(h.slice(1));
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){location.hash='';}try{localStorage.removeItem('adamGooglePending');}catch(e){}
  if(P.get('error_description')){modal(`<h2>ההתחברות עם Google לא הצליחה 😕</h2><p style="font-size:17px">${escH(P.get('error_description'))}</p><button class="btn green" onclick="closeModal()">אוקיי</button>`);return true;}
  const at=P.get('access_token');try{const u=await sbUser(at);setAuth(Object.assign({at,rt:P.get('refresh_token'),exp:Date.now()+((+P.get('expires_in')||3600)-60)*1000,uid:u.id,email:u.email},profOf(u)));
    try{await rest('POST','profiles?on_conflict=user_id',{user_id:AUTH.uid,display_name:AUTH.name||showName()},{headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});}catch(x){}
    await cloudSyncFull();modal(`<div class="mascot mood-happy" style="margin:0 auto;width:90px;height:96px">${ROBO}</div><h2>התחברת, ${escH(showName())}! 🎉</h2><p style="font-size:18px">מעכשיו ההתקדמות שלך נשמרת בענן, ואפשר להמשיך מכל מכשיר.</p><button class="btn green" onclick="closeModal()">יאללה! 👍</button>`);}
  catch(e){modal(`<h2>ההתחברות עם Google לא הצליחה 😕</h2><p style="font-size:17px">נסה שוב בעוד רגע.</p><button class="btn green" onclick="closeModal()">אוקיי</button>`);}return true;}
function loginScreen(mode){mode=mode||'in';try{localStorage.setItem(ASKED_KEY,'1');}catch(e){}
  modal(`<div class="mascot" style="margin:0 auto;width:80px;height:86px">${ROBO}</div><h2>${mode==='in'?'🔑 התחברות':'✨ הרשמה'}</h2>
   <button class="gbtn" id="lGoogle" type="button">${GLOGO}<span>התחבר עם Google</span></button>
   <div class="lor"><span>או עם שם משתמש וסיסמה</span></div>
   <div class="ltabs"><button class="ltab ${mode==='in'?'on':''}" data-m="in">התחברות</button><button class="ltab ${mode==='up'?'on':''}" data-m="up">הרשמה</button></div>
   <form id="lForm" class="lform" autocomplete="on"><label>שם משתמש או אימייל<input id="lUser" name="username" autocomplete="username" dir="ltr" required placeholder="adam"></label>
   <label>סיסמה (לפחות 6 תווים)<input id="lPass" type="password" name="password" autocomplete="${mode==='in'?'current-password':'new-password'}" dir="ltr" required minlength="6"></label>
   <div class="lerr" id="lErr"></div><button class="btn green" type="submit" id="lGo">${mode==='in'?'היכנס ▶':'צור משתמש ✨'}</button></form>
   <p style="font-size:15px;color:#6b7280">${mode==='in'?'עוד אין לך משתמש? לחץ על „הרשמה”.':'בוחרים שם משתמש וסיסמה – ואפשר להתחבר מכל מכשיר.'}</p>
   <button class="btn ghost" id="lSkip">👤 המשך כאורח</button>`);
  document.querySelectorAll('.ltab').forEach(b=>b.onclick=()=>loginScreen(b.dataset.m));$('#lSkip').onclick=closeModal;$('#lGoogle').onclick=googleLogin;
  $('#lForm').onsubmit=async e=>{e.preventDefault();const u=$('#lUser').value,p=$('#lPass').value;const err=$('#lErr');err.textContent='';$('#lGo').disabled=true;
    try{const email=toEmail(u);if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)||email.startsWith('@'))throw new Error('שם משתמש לא תקין (אותיות באנגלית ומספרים)');
      const j=mode==='up'?await sbAuth('signup',{email,password:p}):await sbAuth('token?grant_type=password',{email,password:p});
      if(!j.access_token)throw new Error('ההרשמה לא הושלמה');setAuth(sessFrom(j));
      if(mode==='up')try{await rest('POST','profiles?on_conflict=user_id',{user_id:AUTH.uid,display_name:String(u).split('@')[0]},{headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});}catch(x){}
      await cloudSyncFull();closeModal();modal(`<div class="mascot mood-happy" style="margin:0 auto;width:90px;height:96px">${ROBO}</div><h2>${mode==='up'?'נרשמת':'התחברת'}, ${showName()}! 🎉</h2><p style="font-size:18px">מעכשיו ההתקדמות שלך נשמרת בענן, ואפשר להמשיך מכל מכשיר.</p><button class="btn green" onclick="closeModal()">יאללה! 👍</button>`);}
    catch(x){let m=String(x.message||x);if(/Invalid login/i.test(m))m='שם המשתמש או הסיסמה לא נכונים';else if(/already registered|already exists/i.test(m))m='המשתמש הזה כבר קיים – נסה „התחברות”';else if(/Failed to fetch|NetworkError|Load failed/i.test(m))m='אין חיבור לאינטרנט כרגע';else if(/Password/i.test(m))m='הסיסמה צריכה להיות לפחות 6 תווים';err.textContent=m;$('#lGo').disabled=false;}};}
$('#userBtn').onclick=userMenu;syncUI();
handleOAuthReturn().then(done=>{if(done)return;if(AUTH)cloudSyncFull();else{let asked=null;try{asked=localStorage.getItem(ASKED_KEY);}catch(e){}if(!asked)setTimeout(()=>{if(!document.querySelector('#modal.on'))loginScreen('in');},600);}});
window.__app.CLOUD={mergeSaves,cloudSyncFull,cloudPush,get AUTH(){return AUTH;},get SYNC(){return SYNC;},loginScreen,userMenu,toEmail,googleUrl,handleOAuthReturn};

/* ============ v17: סיכום טקסט – AI feedback via Supabase Edge Function (key stays on the server) ============ */
const SUM_FN=SB_URL+'/functions/v1/summary-check';
function sumList(){if(!Array.isArray(SAVE.sumx))SAVE.sumx=[];return SAVE.sumx;}
const sumEsc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sumCardHTML(){const L=sumList(),best=L.length?Math.max(...L.map(a=>a.score)):null;
  return `<div class="extras"><button class="mission big" id="goSumm"><span class="ic" style="font-size:54px;display:grid;place-items:center">📝</span><span><h3>סיכום טקסט – עם משוב חכם</h3><p>מדביקים קטע, כותבים סיכום במילים שלך, ומקבלים משוב: מה תפסת, מה חסר וטיפים. ${L.length?`ניסיונות: <b>${L.length}</b> · השיא: <b class="co">${best}/100</b>`:''}</p></span></button></div>`;}
function sumBind(B){const b=B.querySelector('#goSumm');if(b)b.onclick=openSumm;}
let SUMD={text:'',summary:''};
function openSumm(){closeModal();show('summ');renderSumm();}
function renderSumm(){const L=sumList().slice().reverse();
  $('#summBody').innerHTML=`<h1>📝 סיכום טקסט</h1><p class="psub">1️⃣ הדבק את הקטע מהספר או מהדף. 2️⃣ כתוב סיכום <b>במילים שלך</b>: הרעיון המרכזי והנקודות החשובות, בלי פרטים קטנים ובלי דעה. 3️⃣ לחץ „בדוק את הסיכום” ✨</p>
   ${AUTH?'':'<div class="sumwarn">🔐 כדי לקבל משוב צריך להיות מחובר (כפתור 👤 למעלה).</div>'}
   <label class="sumlab" for="sumText">📄 הטקסט</label><textarea id="sumText" class="sumta" rows="8" placeholder="הדבק כאן את הטקסט…">${sumEsc(SUMD.text)}</textarea>
   <label class="sumlab" for="sumMine">✍️ הסיכום שלי</label><textarea id="sumMine" class="sumta" rows="6" placeholder="כתוב כאן את הסיכום שלך…">${sumEsc(SUMD.summary)}</textarea>
   <div class="sumcnt" id="sumCnt"></div>
   <div class="stgacts"><button class="btn green" id="sumCheck">✨ בדוק את הסיכום</button><button class="btn ghost" id="sumBack">✍️ להבעה</button></div>
   <div id="sumOut"></div>
   ${L.length?`<h3 class="ph3">📈 הסיכומים שלי (${L.length})</h3><div class="sumhist">${L.slice(0,10).map(a=>`<div class="sumh"><b>${a.score}/100</b><span>${new Date(a.t).toLocaleDateString('he-IL')}</span><small>${sumEsc(a.head||'')}</small></div>`).join('')}</div>`:''}`;
  const t=$('#sumText'),m=$('#sumMine');const cnt=()=>{SUMD.text=t.value;SUMD.summary=m.value;const a=t.value.trim().split(/\s+/).filter(Boolean).length,b=m.value.trim().split(/\s+/).filter(Boolean).length;$('#sumCnt').textContent=`בטקסט: ${a} מילים · בסיכום: ${b} מילים${a&&b?` (${Math.round(b/a*100)}%)`:''}`;};
  t.oninput=m.oninput=cnt;cnt();$('#sumBack').onclick=()=>show('hebrew');$('#sumCheck').onclick=sumCheck;}
const SUM_ERR={not_logged_in:'🔐 צריך להתחבר כדי לקבל משוב. לחץ על 👤 למעלה ותתחבר עם Google.',too_short:'✏️ הטקסט או הסיכום קצרים מדי. הדבק טקסט שלם וכתוב לפחות משפט או שניים.',
  not_configured:'🔌 הבודק החכם עוד לא מחובר. אבא מסדר את זה – בינתיים הסיכום שלך נשמר כאן, נסה שוב מאוחר יותר 🙂',net:'🔌 הבודק החכם עוד לא מחובר או שאין אינטרנט. הסיכום שלך נשאר כאן – נסה שוב מאוחר יותר 🙂'};
async function sumCheck(){const text=$('#sumText').value.trim(),summary=$('#sumMine').value.trim(),out=$('#sumOut');
  if(text.length<40||summary.length<10){out.innerHTML=`<div class="sumwarn">${SUM_ERR.too_short}</div>`;return;}
  if(!AUTH){out.innerHTML=`<div class="sumwarn">${SUM_ERR.not_logged_in}</div>`;return;}
  const btn=$('#sumCheck');btn.disabled=true;out.innerHTML=`<div class="sumwait">🤖 רובי קורא את הסיכום שלך…</div>`;
  let res=null,err='net';
  try{const tk=await token();const r=await fetch(SUM_FN,{method:'POST',headers:{Authorization:'Bearer '+tk,apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({text,summary})});
    const j=await r.json().catch(()=>({}));if(r.ok&&typeof j.score==='number')res=j;else err=SUM_ERR[j.error]?j.error:'net';}catch(e){err='net';}
  btn.disabled=false;if(!res){out.innerHTML=`<div class="sumwarn">${SUM_ERR[err]}</div>`;return;}
  sumList().push({t:Date.now(),score:res.score,tw:text.split(/\s+/).length,sw:summary.split(/\s+/).length,head:text.slice(0,60)});if(SAVE.sumx.length>200)SAVE.sumx.splice(0,SAVE.sumx.length-200);persistSafe();
  sumShow(res);if(res.score>=85){sfx('win');confetti(2500,150);}else sfx('good');}
function sumShow(r){const li=(a,ic)=>a&&a.length?`<ul>${a.map(x=>`<li>${ic} ${sumEsc(x)}</li>`).join('')}</ul>`:'';
  $('#sumOut').innerHTML=`<div class="sumres"><div class="sumscore">${r.score}<small>/100</small></div><p class="sumpraise">🌟 ${sumEsc(r.praise)}</p>
   ${r.main_idea?`<div class="sumbox idea"><h4>💡 הרעיון המרכזי</h4><p>${sumEsc(r.main_idea)}</p></div>`:''}
   ${r.captured.length?`<div class="sumbox ok"><h4>✅ מה תפסת</h4>${li(r.captured,'')}</div>`:''}
   ${r.missing.length?`<div class="sumbox miss"><h4>🧩 מה חסר</h4>${li(r.missing,'')}</div>`:''}
   ${r.wrong.length?`<div class="sumbox bad"><h4>⚠️ מה לא מדויק</h4>${li(r.wrong,'')}</div>`:''}
   ${r.tips.length?`<div class="sumbox tip"><h4>🎯 טיפים לפעם הבאה</h4>${li(r.tips,'')}</div>`:''}</div>`;
  $('#sumOut').scrollIntoView({behavior:'smooth',block:'start'});}
window.__app.SUMM={openSumm,sumShow,sumCheck};

</script>
