<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>אדם במסע הצירים</title>
<style>
:root{--x:#ff4d6d;--y:#3a86ff;--ink:#2b2d42;--muted:#6b7280;--gold:#ffbe0b;--green:#2ec4b6;--purple:#8338ec;--orange:#fb8500;--pink:#ff70a6;--teal:#06d6a0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;font-family:"Rubik","Varela Round","Segoe UI","Arial Hebrew",Arial,sans-serif;color:var(--ink);
 background:radial-gradient(circle at 12% 12%,#fff0cc 0,transparent 38%),radial-gradient(circle at 90% 85%,#d9f0ff 0,transparent 42%),linear-gradient(160deg,#eaf6ff,#f4ecff);min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
.co{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700;white-space:nowrap}
.co .cx{color:var(--x);font-style:normal}.co .cy{color:var(--y);font-style:normal}
.tx{color:var(--x);font-weight:700}.ty{color:var(--y);font-weight:700}
/* top bar */
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#ffffffcc;backdrop-filter:blur(6px);box-shadow:0 2px 12px #3a86ff1a;position:sticky;top:0;z-index:5}
.brand{font-size:24px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.brand .lx{color:var(--x)}.brand .ly{color:var(--y)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px;box-shadow:0 2px 8px #0001}
.btn{border:none;border-radius:18px;padding:12px 22px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(180deg,#4895ff,#3a6bff);box-shadow:0 5px 0 #2747b8;transition:transform .08s,box-shadow .08s,opacity .2s}
@media (hover:hover){.btn:hover{filter:brightness(1.07)}.opt:hover{background:#f5f9ff}.mission:hover{transform:translateY(-4px) rotate(-.5deg)}}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2747b8}
.btn.green{background:linear-gradient(180deg,#34d8a8,#12b886);box-shadow:0 5px 0 #0b8a63}
.btn.green:active{box-shadow:0 1px 0 #0b8a63}
.btn.orange{background:linear-gradient(180deg,#ffb347,#fb8500);box-shadow:0 5px 0 #b65f00}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d4d9e6}
.btn.small{font-size:16px;padding:8px 14px;border-radius:14px}
.btn:disabled{opacity:.5;background:#b9c0cd;box-shadow:0 5px 0 #98a0af;cursor:default;transform:none}
.btn.pulse:not(:disabled){animation:pulse 1.2s 3}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.screen{display:none}.screen.on{display:block}
/* mascot */
.robo{width:100%;height:100%;overflow:visible}
.robo .m-big,.robo .m-oops{display:none}
.mood-happy .robo .m-happy{display:none}.mood-happy .robo .m-big{display:inline}
.mood-oops .robo .m-happy{display:none}.mood-oops .robo .m-oops{display:inline}
.robo .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mascot{width:96px;height:104px;flex:none}
.mood-happy .mascot{animation:hop .6s ease 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-4deg)}}
.mood-oops .mascot{animation:tilt .8s ease}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}}
.talk{display:flex;align-items:flex-start;gap:10px}
.bubble{position:relative;background:#fff;border-radius:20px;padding:14px 16px;font-size:19px;line-height:1.55;box-shadow:0 4px 14px #0000000f;flex:1;min-height:70px}
.bubble:before{content:"";position:absolute;right:-10px;top:26px;border:10px solid transparent;border-left-color:#fff;border-right:0}
.mood-happy .bubble{background:#eafff6}.mood-happy .bubble:before{border-left-color:#eafff6}
.mood-oops .bubble{background:#fff6e5}.mood-oops .bubble:before{border-left-color:#fff6e5}
/* home */
.home{max-width:1280px;margin:0 auto;padding:22px 20px 40px}
.hero{display:flex;align-items:center;gap:22px;background:#ffffffd9;border-radius:30px;padding:20px 26px;box-shadow:0 8px 26px #3a86ff1f}
.hero .mascot{width:150px;height:162px}
.hero h1{margin:0 0 6px;font-size:34px}
.hero p{margin:0;font-size:20px;line-height:1.6;color:#41435a}
.stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.stats .pill{font-size:17px}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:26px}
.mission{position:relative;background:#fff;border-radius:26px;padding:16px 18px 18px;border:none;text-align:right;box-shadow:0 6px 0 #dfe5f3,0 10px 22px #0000000d;transition:transform .15s;display:flex;gap:14px;align-items:center;color:var(--ink)}
.mission .num{position:absolute;top:-10px;right:-8px;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#5a3d00;font-weight:900;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 #d39b00}
.mission .ic{width:72px;height:72px;flex:none;border-radius:20px;background:#f3f7ff}
.mission h3{margin:0 0 4px;font-size:20px}
.mission{min-height:128px}
.okline{margin-top:8px;padding-top:8px;border-top:2px dashed #b8ecd9;font-weight:700;color:#0b8a63}
.mission p{margin:0;font-size:15.5px;color:var(--muted);line-height:1.4}
.mission .done{margin-top:5px;display:flex;gap:2px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
.mission{cursor:pointer;align-items:flex-start}
.mission .mbody{display:flex;flex-direction:column;flex:1;min-width:0}
.mission .practice{margin-top:10px;align-self:stretch;font-size:16px;padding:9px 10px;background:linear-gradient(180deg,#34d8a8,#12b886);box-shadow:0 4px 0 #0b8a63}
.stmt{margin-top:8px;background:#f1f6ff;border-right:5px solid #3a86ff;border-radius:14px;padding:10px 12px;font-size:21px}
.tfopts .opt{font-size:23px;padding:16px 8px}
.tfopts .opt:first-child{color:#0b8a63}.tfopts .opt:nth-child(2){color:#c9184a}
.mission.big{grid-column:span 3;background:linear-gradient(135deg,#fff7e0,#ffe9f2)}
.mission.big .ic{background:#fff;width:96px;height:96px}
.mission.big h3{font-size:25px}
.badge-start{position:absolute;top:-12px;left:14px;background:var(--x);color:#fff;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;animation:pulse 1.4s 4}
.star{width:22px;height:22px;display:inline-block;vertical-align:middle}
/* stage */
.stage{display:flex;gap:18px;padding:14px 18px;align-items:flex-start;justify-content:center}
.side{width:440px;flex:none;display:flex;flex-direction:column;gap:12px}
.planeWrap{height:calc(100vh - 92px);max-height:760px;aspect-ratio:1;max-width:calc(100vw - 500px);min-height:420px}
.planeWrap,.plane{touch-action:none}
.planeWrap,.plane,.plane *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.plane{width:100%;height:100%;display:block}
.card{background:#ffffffe6;border-radius:24px;padding:14px 16px;box-shadow:0 6px 18px #0000000d}
.title{font-size:24px;font-weight:800;margin:0;display:flex;align-items:center;gap:10px}
.steps{display:flex;gap:6px;margin-top:8px}
.steps i{flex:1;height:10px;border-radius:6px;background:#e3e8f4}
.steps i.on{background:linear-gradient(90deg,#ffbe0b,#fb8500)}
.steps i.cur{background:#ffd166}
.task{background:#fff;border:3px dashed #ffbe0b;border-radius:20px;padding:12px 14px;font-size:20px;font-weight:700;line-height:1.5}
.task.ok{border:3px solid var(--teal);background:#effff9}
.task:empty{display:none}
.navrow{display:flex;gap:10px;justify-content:space-between}
.readout{display:flex;flex-direction:column;gap:6px}
.ro{display:flex;align-items:center;gap:8px;font-size:21px;background:#fff;border-radius:16px;padding:6px 12px}
.ro .dotc{width:18px;height:18px;border-radius:50%;flex:none}
.ro .lab{font-weight:800}
.ro .bdg{margin-inline-start:auto;font-size:14px;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff}
.bdg.bx{background:var(--x)}.bdg.by{background:var(--y)}.bdg.bo{background:linear-gradient(90deg,var(--x),var(--y))}.bdg.bs{background:var(--orange)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:none;background:#fff;border-radius:18px;padding:14px 10px;font-size:21px;font-weight:700;color:var(--ink);box-shadow:0 5px 0 #d9dfee;transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #d9dfee}
.opt.wrong{background:#ffe3e3;color:#b4485b;box-shadow:0 5px 0 #f5b8b8;opacity:.7;text-decoration:line-through;pointer-events:none}
.opt.right{background:#d8fff1;box-shadow:0 5px 0 #7be0bf}
.opt:disabled{cursor:default}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.keypad button{border:none;background:#fff;border-radius:14px;font-size:24px;font-weight:800;padding:10px 0;box-shadow:0 4px 0 #d9dfee;color:var(--ink)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9dfee}
.numrow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.numdisp{flex:1;height:58px;border-radius:16px;background:#fff;border:3px solid #cfd8ee;font-size:34px;font-weight:900;display:grid;place-items:center;direction:ltr}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{display:flex;gap:5px;flex:1}
.prog span{flex:1;height:30px;border-radius:10px;background:#e6ebf5;display:grid;place-items:center}
.prog span.cur{background:#fff3c4;outline:3px solid var(--gold)}
.prog span.st{background:#fff4cc}
.prog span.ok{background:#dcfff3}
.prog svg{width:22px;height:22px}
.scorebig{font-size:22px;font-weight:900;background:linear-gradient(90deg,#ffbe0b,#fb8500);color:#fff;border-radius:16px;padding:6px 14px;box-shadow:0 4px 0 #c46a00;white-space:nowrap}
.streak{font-size:16px;font-weight:800;color:#e85d04;background:#fff1e6;border-radius:999px;padding:4px 10px}
.streak:empty{display:none}
.prompt{font-size:22px;font-weight:700;line-height:1.55;margin:4px 0 0}
.qnum{font-size:15px;color:var(--muted);font-weight:700}
.hintline{font-size:15px;color:var(--muted);margin-top:6px}
/* summary */
.sumcard{max-width:720px;margin:40px auto;background:#fff;border-radius:34px;padding:30px;text-align:center;box-shadow:0 10px 30px #3a86ff22}
.sumscore{font-size:96px;font-weight:900;line-height:1;background:linear-gradient(90deg,#ff4d6d,#fb8500,#ffbe0b);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.sumstars{display:flex;justify-content:center;gap:6px;margin:16px 0}
.sumstars svg{width:46px;height:46px}
.sumstars svg.pop{animation:popin .4s both}
@keyframes popin{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.summsg{font-size:26px;font-weight:800;margin:10px 0 6px}
.sumsub{font-size:19px;color:#555;margin-bottom:20px;line-height:1.5}
.trophy{width:140px;height:140px;margin:0 auto;animation:hop 1s ease infinite}
/* modal */
.modal{position:fixed;inset:0;background:#2b2d4266;display:none;place-items:center;z-index:20}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:30px;padding:26px 30px;max-width:620px;width:92%;text-align:center;box-shadow:0 20px 50px #0003;animation:popin .3s both}
.modal h2{margin:6px 0 10px;font-size:30px}
.modal .rules{text-align:right;font-size:19px;line-height:1.7}
.modal .rules li{margin-bottom:6px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;display:none}
/* plane svg */
.plane .board{fill:#fff}
.plane .grid{stroke:#e4ebf8;stroke-width:1.3}
.plane .grid.g5{stroke:#ccd8f0}
.plane .axis{stroke-width:4;stroke-linecap:round;transition:stroke-width .2s}
.plane .ax-x{stroke:var(--x)}.plane .ax-y{stroke:var(--y)}
.plane .axis.glow{stroke-width:9}
.plane .tick{font-size:14px;fill:#7a8199;font-weight:600;font-family:inherit}
.plane .axlab{font-size:24px;font-weight:900;font-style:italic;font-family:Georgia,serif}
.plane .pt .hit{fill:transparent}
.plane .pt.drag,.plane .pt.tap{cursor:grab}
.plane .pt.dragging{cursor:grabbing}
.plane .pt .dot{stroke:#fff;stroke-width:4;transform-box:fill-box;transform-origin:center;transition:transform .15s}
.plane .pt.dragging .dot{transform:scale(1.3)}
.plane .pt.drag .ring{fill:none;stroke-width:3;stroke-dasharray:5 5;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (hover:hover){.plane .pt.tap:hover .dot{transform:scale(1.2)}}
.plane .plabel{font-size:20px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:5px;font-family:inherit}
.plane .seg{stroke:var(--orange);stroke-width:7;stroke-linecap:round}
.plane .segdot{fill:#fff;stroke:var(--orange);stroke-width:2}
.plane .segpill rect{fill:var(--orange)}
.plane .segpill text{fill:#fff;font-weight:900;font-size:20px;font-family:inherit}
.plane .guide{stroke-width:3;stroke-dasharray:7 6;fill:none}
.plane .tpill rect{rx:9}
.plane .tpill text{fill:#fff;font-weight:900;font-size:15px;font-family:inherit}
.plane .oring{fill:none;stroke:#8338ec;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:oring 1s infinite}
@keyframes oring{0%{transform:scale(1);opacity:1}100%{transform:scale(3.2);opacity:0}}
.plane .wrongpt .dot{animation:blinkred .5s 2}
@keyframes blinkred{50%{fill:#ff4d6d}}
.plane .goodpt .dot{stroke:#06d6a0;stroke-width:6}
.legend{font-size:15px;color:var(--muted);display:flex;gap:14px;justify-content:center}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* ===== phone / narrow screens ===== */
@media (max-width:820px){
  body{overflow-x:hidden}
  .top{height:auto;min-height:54px;padding:6px 10px;gap:6px;padding-top:max(6px,env(safe-area-inset-top))}
  .brand{font-size:18px}
  .top .btn.small{font-size:15px;padding:8px 10px}
  .top .pill{font-size:16px;padding:5px 10px}
  .top .rtxt,.brand .rocket{display:none}
  .brand{white-space:nowrap;font-size:19px}
  .home{padding:12px 10px 30px}
  .hero{flex-direction:column;text-align:center;padding:14px;gap:6px;border-radius:24px}
  .hero .mascot{width:96px;height:104px}
  .hero h1{font-size:28px}
  .hero p{font-size:17px}
  .stats{justify-content:center}
  .stats .pill{font-size:14px;padding:5px 10px}
  .map{grid-template-columns:1fr;gap:16px;margin-top:18px}
  .mission,.mission.big{grid-column:auto;min-height:0;padding:14px}
  .mission .ic{width:64px;height:64px}
  .mission.big .ic{width:72px;height:72px}
  .mission.big h3{font-size:21px}
  .stage{flex-direction:column;align-items:stretch;gap:10px;padding:10px 10px 28px}
  .side{display:contents}
  .planeWrap{width:100%;height:auto;max-width:none;max-height:none;min-height:0;aspect-ratio:1/1;order:5}
  .stage>.side>*{order:6}
  /* lesson: title, explanation, task, BOARD, answers, readout, nav */
  #lesson .side>.card{order:1}#lTalk{order:2}#lTask{order:3}#lPlane{order:4}#lAns{order:5}#lRead{order:6}#lesson .navrow{order:7}
  /* quiz: score+question, BOARD, answers, mascot, readout, next */
  #quiz .side>.card{order:1}#qPlane{order:2}#qAns{order:3}#qTalk{order:4}#qRead{order:5}#quiz .navrow{order:6}
  /* sandbox */
  #sandbox .side>.card{order:1}#sTalk{order:2}#sPlane{order:3}#sRead{order:4}#sInfo{order:5}#sandbox .navrow{order:6}
  .card{padding:12px}
  .title{font-size:20px}
  .mascot{width:64px;height:70px}
  .bubble{font-size:17px;padding:10px 12px;min-height:0}
  .bubble:before{top:18px}
  .task{font-size:18px;padding:10px 12px}
  .prompt{font-size:19px}
  .scorebig{font-size:18px;padding:4px 10px}
  .prog{gap:3px}.prog span{height:24px;border-radius:7px}.prog svg{width:17px;height:17px}
  .ro{font-size:18px}
  .opt{font-size:19px;padding:14px 8px;min-height:56px}
  .btn{font-size:18px;padding:12px 18px;min-height:50px}
  .navrow .btn{flex:1}
  .keypad button{font-size:22px;padding:12px 0;min-height:50px}
  .sumcard{margin:14px 10px;padding:20px 14px;border-radius:26px}
  .sumscore{font-size:72px}
  .sumstars{gap:2px;flex-wrap:wrap}.sumstars svg{width:28px;height:28px}
  .summsg{font-size:22px}.sumsub{font-size:17px}
  .trophy{width:100px;height:100px}
  .modal .box{padding:18px 16px}.modal h2{font-size:24px}.modal .rules{font-size:16.5px}
}
/* ===== v2: plan, hub, keypad fields ===== */
.hero .heroTxt{flex:1;min-width:0}
.hero p{font-size:19px}
.plan{max-width:940px;margin:24px auto 0}
.planTitle{margin:0 0 8px;font-size:28px}
.pbarTxt{font-size:20px;margin-bottom:8px}
.pbar{display:flex;gap:5px}
.pbar i{flex:1;height:20px;border-radius:10px;background:#e3e8f4}
.pbar i.on{background:linear-gradient(90deg,#34d8a8,#12b886)}
.pbar i.cur{background:#ffd166;outline:3px solid var(--gold)}
.bigcont{width:100%;font-size:26px;padding:18px 22px;margin:14px 0 20px;animation:pulse 1.6s 3}
.units{display:flex;flex-direction:column;gap:18px}
.unit{position:relative;display:flex;gap:14px;align-items:center;background:#fff;border-radius:26px;padding:16px 18px;border:none;text-align:right;color:var(--ink);width:100%;cursor:pointer;box-shadow:0 6px 0 #dfe5f3,0 10px 22px #0000000d}
.unit.done{background:#effff9;box-shadow:0 6px 0 #b8ecd9}
.unit.next{outline:4px solid var(--gold)}
.unit.locked{background:#eef0f6;color:#7a8199;box-shadow:0 6px 0 #d4d9e6;cursor:pointer}
.unit.locked .ic{opacity:.45}
.unit .num{position:absolute;top:-10px;right:-8px;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#5a3d00;font-weight:900;font-size:21px;display:grid;place-items:center;box-shadow:0 3px 0 #d39b00}
.unit.locked .num{background:#c9cfdd;color:#fff;box-shadow:0 3px 0 #a9b0c2}
.unit .ic{width:72px;height:72px;flex:none;border-radius:20px;background:#f3f7ff}
.unit .ubody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.unit h3{margin:0;font-size:22px}
.unit p{margin:0;font-size:16px;color:var(--muted)}
.unit .ex{font-size:14px;color:#8a90a6;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{background:#eef2fb;border-radius:999px;padding:3px 11px;font-weight:800;font-size:15px;color:#5b6180}
.chip.ok{background:#d8fff1;color:#0b8a63}
.chip small{font-weight:700}
.lockmsg{font-size:15px;font-weight:700}
.ustars{display:flex;flex-direction:column;align-items:center;font-size:24px;min-width:62px}
.ustars .star{width:20px;height:20px}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.extras .mission{min-height:0;align-items:center}
.extras .mission.big{grid-column:auto;order:2}
.hub{max-width:900px}
.hub .qnum{margin-bottom:4px}
.hubic{display:inline-block;width:46px;height:46px;vertical-align:middle;margin-inline-end:10px}
.steplist{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.hstep{display:flex;align-items:center;gap:14px;background:#fff;border:none;border-radius:22px;padding:16px 18px;text-align:right;color:var(--ink);box-shadow:0 5px 0 #dfe5f3;cursor:pointer;font-size:19px}
.hstep .hs-n{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#5a3d00;font-weight:900;font-size:21px;display:grid;place-items:center;flex:none}
.hstep.done{background:#effff9;box-shadow:0 5px 0 #b8ecd9}.hstep.done .hs-n{background:var(--teal);color:#fff}

  let o;if(eq(a,c,b,d))o=[a,b,c,d];else if(eq(a,b,c,d))o=[a,c,b,d];else o=[a,b,d,c];
  return dist2(o[0],o[1])===dist2(o[1],o[2]);}

let AC=null,soundOn=true;
function sfx(type){
  if(!soundOn)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seqs={good:[[660,0],[880,.09],[1175,.18]],bad:[[330,0],[262,.13]],tick:[[1250,0]],pick:[[720,0]],win:[[523,0],[659,.12],[784,.24],[1047,.36],[1319,.5],[1568,.62]]};
    (seqs[type]||[]).forEach(([f,t])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=type==='bad'?'triangle':'sine';o.frequency.value=f;
      const st=AC.currentTime+t,dur=type==='tick'?.035:.17,vol=type==='tick'?.035:.16;
      g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(vol,st+.01);g.gain.exponentialRampToValueAtTime(.0001,st+dur);
      o.connect(g).connect(AC.destination);o.start(st);o.stop(st+dur+.03);
    });
  }catch(e){}
}

/* ============ keypad (1, 2 or 4 fields) ============ */
function keypad(host,cb,o){
  o=o||{};const n=o.n||1,neg=!!o.neg,fl=o.fl,rl=o.rl;
  const vals=Array(n).fill('');let cur=0;
  let fields;
  if(fl)fields=fl.map((l,i)=>`<div class="fld"><span class="fl">${l}</span><div class="numdisp f" data-f="${i}">?</div></div>`).join('');
  else if(n===1)fields=`<div class="numdisp f" data-f="0">?</div>`;
  else{fields='';for(let r=0;r<n/2;r++)fields+=`<div class="prow">${rl?`<b class="rl">${rl[r]}</b>`:''}<span class="par">(</span><div class="numdisp f" data-f="${2*r}">?</div><span class="par">,</span><div class="numdisp f" data-f="${2*r+1}">?</div><span class="par">)</span></div>`;}
  host.innerHTML=`<div class="card"><div class="numrow${n>1?' multi':''}"><div class="fields${n>1&&!fl?' pairs':''}${fl?' fl':''}">${fields}</div><button class="btn green" data-ok="1">בדוק ✓</button></div>
   <div class="keypad">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-n="${d}">${d}</button>`).join('')}</div>
   <div class="keyrow">${neg?'<button class="btn ghost small" data-pm="1">± מינוס</button>':''}${n>1&&!fl?'<button class="btn ghost small" data-comma="1">, הבא</button>':''}<button class="btn ghost small" data-del="1">⌫ מחק</button></div></div>`;
  const F=[...host.querySelectorAll('.f')];
  const upd=()=>F.forEach((d,i)=>{const v=vals[i];d.textContent=(v===''||v==='-')?(v==='-'?'\u2212?':'?'):v.replace('-','\u2212');d.classList.toggle('act',n>1&&i===cur);});
  F.forEach((d,i)=>d.onclick=()=>{cur=i;upd();});
  const next=()=>{if(cur<n-1){cur++;upd();}};
  host.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const v=vals[cur];const sg=v.startsWith('-')?'-':'';let dg=v.replace('-','');if(dg.length<3){dg=String(+(dg+b.dataset.n));vals[cur]=sg+dg;upd();sfx('tick');}});
  host.querySelector('[data-del]').onclick=()=>{if(vals[cur]===''&&cur>0)cur--;else vals[cur]=vals[cur].slice(0,-1);upd();};
  const pm=host.querySelector('[data-pm]');if(pm)pm.onclick=()=>{const v=vals[cur];vals[cur]=v.startsWith('-')?v.slice(1):'-'+v;upd();sfx('tick');};
  const cm=host.querySelector('[data-comma]');if(cm)cm.onclick=()=>{next();sfx('tick');};
  host.querySelector('[data-ok]').onclick=()=>{
    if(vals.some(v=>v===''||v==='-')){const e=vals.findIndex(v=>v===''||v==='-');cur=e;upd();return;}
    const nums=vals.map(Number);const ok=cb(n===1?nums[0]:nums);
    if(!ok){F.forEach(d=>{d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');});setTimeout(()=>{vals.fill('');cur=0;upd();},450);}
    else{host.querySelectorAll('button').forEach(b=>b.disabled=true);F.forEach(d=>{d.style.borderColor='#06d6a0';d.style.background='#effff9';});}};
  host._key=k=>{if(/^[0-9]$/.test(k)){const b=host.querySelector(`[data-n="${k}"]`);b&&b.click();}else if(k==='Backspace')host.querySelector('[data-del]').click();else if(k==='-'&&pm)pm.click();else if((k===','||k==='Tab'||k===' ')&&cm)cm.click();else if(k==='Enter')host.querySelector('[data-ok]').click();};
  upd();
}

const NUMTXT='הקלד את התשובה בלוח המספרים ולחץ <b>בדוק</b>';
function mountQ(q,env){
  const P=q.angle?makeAngleBoard($(env.plane),q.angle):makePlane($(env.plane),q.board);
  q.setup&&q.setup(P);P.refresh();
  const upd=()=>{if(env.read)readout($(env.read),P,q.read||[]);};upd();P.onChange=upd;P.onDrop=upd;
  const a=$(env.ans);a.innerHTML='';a._key=null;
  const say2=(h,m)=>env.say&&env.say(h,m);
  const ctl={P,q,a};
  if(q.kind==='mc'){
    a.innerHTML=`<div class="opts${q.tf?' tfopts':''}" style="${q.cols1?'grid-template-columns:1fr':''}">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${o.html}</button>`).join('')}</div>`;
    a.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(env.isDone())return;const ok=q.options[+b.dataset.k].correct;b.classList.add(ok?'right':'wrong');if(ok)a.querySelectorAll('.opt').forEach(x=>x.disabled=true);env.result(ok,{t:'mc',h:q.options[+b.dataset.k].html});});
    if(env.quiz)say2(q.tf?'קרא את המשפט והחלט: נכון או לא נכון? 🤔':'בחר את התשובה הנכונה 👆',null);
  }else if(q.kind==='multi'){
    a.innerHTML=`<div class="opts" style="${q.cols1?'grid-template-columns:1fr':''}">${q.options.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="false">${o.html}</button>`).join('')}</div><button class="btn green" id="mCheck" style="width:100%;font-size:22px;margin-top:10px">בדוק ✓</button>`;
    const bs=[...a.querySelectorAll('.opt')];
    bs.forEach(b=>b.onclick=()=>{if(env.isDone())return;b.classList.toggle('sel');b.setAttribute('aria-pressed',b.classList.contains('sel'));sfx('tick');});
    a.querySelector('#mCheck').onclick=()=>{if(env.isDone())return;const sel=bs.map(b=>b.classList.contains('sel'));const ok=q.options.every((o,i)=>o.correct===sel[i]);const gv={t:'multi',h:q.options.filter((o,i)=>sel[i]).map(o=>o.html)};
      if(ok){bs.forEach((b,i)=>{b.disabled=true;if(q.options[i].correct)b.classList.add('right');});a.querySelector('#mCheck').style.display='none';}
      else{bs.forEach(b=>{b.classList.remove('sel');b.setAttribute('aria-pressed','false');});}
      env.result(ok,gv);};
    if(env.quiz)say2('סמן <b>את כל</b> התשובות הנכונות (יש יותר מאחת) ואז לחץ <b>בדוק</b> 👆',null);
  }else if(q.kind==='drag'){
    if(env.auto){P.onDrop=()=>{upd();if(!env.isDone()&&q.check(P))env.result(true);};}
    else{a.innerHTML=`<button class="btn green" id="qCheck" style="width:100%;font-size:22px">בדוק ✓</button>`;
      $('#qCheck').onclick=()=>{if(env.isDone())return;const ok=q.check(P);const gv={t:'drag',p:Object.keys(P.pts).filter(id=>P.pts[id].o.drag).map(id=>[id,P.pts[id].x,P.pts[id].y])};if(!ok)Object.keys(P.pts).filter(id=>P.pts[id].o.drag).forEach(id=>P.mark(id,'wrongpt'));env.result(ok,gv);};}
    if(env.quiz)say2(Object.values(P.pts).filter(p=>p.o.drag).length>1?'גרור את <b>הנקודות</b> בשרטוט, ואז לחץ <b>בדוק</b> 👈':'גרור את הנקודה בשרטוט (או הקש על משבצת), ואז לחץ <b>בדוק</b> 👈',null);
  }else if(q.kind==='tap'){
    P.onTap=id=>{if(env.isDone())return;const ok=q.tapCheck(id);if(!ok)P.mark(id,'wrongpt');env.result(ok,{t:'tap',id});};P.refresh();
    if(env.quiz)say2(q.angle?(q.angle.tapMode==='pt'?'הקש על האות הנכונה בשרטוט 👈':'הקש על הקשת הצבעונית הנכונה בשרטוט 👈'):'הקש על אחת הנקודות הכחולות בשרטוט 👈',null);
  }else if(q.kind==='num'){
    keypad(a,v=>{if(env.isDone())return true;const ok=q.accept?q.accept(v):(Array.isArray(q.answer)?q.answer.every((x,i)=>x===v[i]):v===q.answer);env.result(ok,{t:'num',v});return ok;},{neg:q.neg,n:q.nf||1,fl:q.fl,rl:q.rl});
    if(env.quiz)say2(NUMTXT+(q.neg?' (למספר שלילי לחץ ±)':''),null);
  }
  return ctl;
}

  const spec=genFan(RNG(seed*7919+13),k,Object.assign({pairs},base));const R=spec.meta.rays;return{spec,V:spec.meta.V,p:R[i],q:R[i+1],s:R[i+2]};}

  S(`כאן כל משבצת על ציר ה-X שווה 2. הנקודה P נמצאת 3 משבצות ימינה (3×2 = 6) ו-2 משבצות למעלה (2×2 = 4). מה השיעורים שלה?`,TPL.readSc.b(SB(5,5,2,2),[6,4]),`נכון! ${co(6,4)}. ספרנו משבצות וכפלנו בערך של משבצת.`),
  S(`עכשיו כל משבצת היא 5. גרור את הנקודה אל ${co(15,10)}.`,TPL.dragTo.b([15,10],[5,5],SB(4,4,5,5)),`יפה! 3 משבצות × 5 = 15, ו-2 משבצות × 5 = 10.`),

  S(`לפעמים מספר חסר על הציר. איך תדע מה כתוב שם? תמצא קודם כמה שווה משבצת אחת.`,TPL.missTick.b(SB(6,6,3,3),'x',4),`נכון! משבצת = 3, ו-4 משבצות = 12.`),

{id:4,icon:'map',title:'מפות וסקאלה במטרים',sub:'פארק (כל משבצת 10 מ׳) ומערכת השקיה',ex:'תרגילים 20, 29',

{id:5,icon:'shape',title:'צורות במישור',sub:'משולש, מרובע, מחומש, מלבן, ריבוע, מקבילית',ex:'תרגילים 21–24',

  I(`<b>מצולע</b> הוא צורה סגורה עם צלעות ישרות. שם המצולע תלוי במספר הצלעות: <b>משולש</b> – 3, <b>מרובע</b> – 4, <b>מחומש</b> – 5. הנה משולש, מרובע ומחומש.`,P=>{P.auto.axis=false;P.auto.guides=false;P.auto.segments=false;P.polys=[{pts:[[0,0],[4,0],[2,4]],fill:'#ff4d6d33',stroke:'#ff4d6d'},{pts:[[5,0],[10,0],[9,4],[6,4]],fill:'#3a86ff33',stroke:'#3a86ff'},{pts:[[1,6],[5,6],[6,8],[3,10],[0,8]],fill:'#06d6a033',stroke:'#06b38a'}];P.refresh();},{board:Q10}),

  S(`עכשיו מרובעים מיוחדים. <b>מלבן</b> הוא מרובע שכל זוויותיו ישרות (90°). <b>ריבוע</b> הוא מלבן שכל צלעותיו שוות. <b>מקבילית</b> היא מרובע שכל צלע בו מקבילה לצלע שממול.`,TPL.defMC.b(0),`כך זה! זוויות ישרות = מלבן.`),
  S(`איזו צורה זאת? בחר את השם <b>המדויק</b> ביותר.`,TPL.shapeName.b([[2,2],[6,2],[6,6],[2,6]]),`נכון! כל צלעותיה שוות וכל זוויותיה ישרות – ריבוע.`),
  S(`בתרגיל 21 נותנים שלוש נקודות ושואלים איזו נקודה <b>לא</b> תשלים מרובע. הסוד: אם הנקודה יושבת על קו ישר אחד עם שתיים אחרות – נקבל משולש במקום מרובע!`,TPL.notComplete.b([[3,2],[9,2],[4,6]],[[5,8],[6,2],[1,9],[4,4]]),`נכון! (6,2) על אותו קו ישר עם שתי הנקודות האחרות – אז לא יוצא מרובע.`),

  S(`ועכשיו תרגיל 23: מאריכים שתי צלעות עד שהן נפגשות וכך נוצר משולש. מהו הקודקוד השלישי של המשולש? ספור: כל פעם 1 ימינה ו-3 למעלה.`,TPL.apex.b([2,0],[3,3],[7,3],[8,0]),`כל הכבוד! המשולש נסגר בנקודה ${co(5,9)}.`),

  S(`בתרגיל 30 נתונה ${co(6,4)} בשם T. הנקודה E נמצאת <b>משמאל</b> ל-T, הקטע ET מקביל לציר ה-X ואורכו 3. מצא את E. רמז: זזים שמאלה, אז ה-X <b>קטן</b> ב-3 וה-Y לא משתנה.`,TPL.findPt.b([6,4],'left',3,'E','T'),`נכון! 6 − 3 = 3, ו-Y נשאר 4: E היא ${co(3,4)}.`),
  S(`עכשיו G נמצאת <b>מימין</b> ל-T, באורך 4. ימינה = ה-X <b>גדל</b>.`,TPL.findPt.b([6,4],'right',4,'G','T'),`נכון! 6 + 4 = 10: G היא ${co(10,4)}.`),
  S(`תרגיל 31: נתונה L${co(5,4)}. הנקודה A נמצאת <b>מעל</b> L, והקטע LA מקביל לציר ה-Y ואורכו 4. למעלה = ה-Y גדל. גרור את A.`,TPL.findDrag.b([5,4],'up',4,'A',[2,2]),`נכון! 4 + 4 = 8: A היא ${co(5,8)}.`),
  S(`ו-M נמצאת <b>מתחת</b> ל-L, באורך 2. למטה = ה-Y קטן. גרור את M.`,TPL.findDrag.b([5,4],'down',2,'M',[8,8]),`נכון! 4 − 2 = 2: M היא ${co(5,2)}.`),
  S(`ועכשיו תרגיל 31ג: מה אורך AM? יש <b>שתי</b> דרכים: לחבר 4 + 2, או לחסר את ה-Y-ים: 8 − 2. (שים לב: האורך הוא <b>מספר אחד</b>, לא נקודה!)`,TPL.lenLM.b([5,4],4,2),`מצוין! 6 בשתי הדרכים.`),
  S(`תרגיל 35: נתונה A${co(5,6)}. הקטע AB מקביל לציר ה-X ואורכו 3. הפעם יש <b>שתי</b> אפשרויות ל-B – שמאלה וגם ימינה! סמן את שתיהן.`,TPL.twoDrag.b([5,6],'x',3,'B',[1,1],[9,9]),`נהדר! ${co(2,6)} ו-${co(8,6)}.`),
  S(`ואם AP מקביל ל<b>אחד הצירים</b> (לא ידוע איזה) ואורכו 2 – כמה אפשרויות יש ל-P?`,TPL.howMany.b([4,4],2,'both'),`נכון! ארבע: ימינה, שמאלה, למעלה ולמטה.`),
  S(`תרגיל 34: מצא את הנקודה שנמצאת 7 יחידות <b>ימינה</b> מהראשית ו-5 יחידות <b>למעלה</b>.`,TPL.atOrigin.b(7,5),`נכון! ${co(7,5)}.`),
  S(`ועוד אחת מ-34: סמן שתי נקודות שהמרחק שלהן מהראשית גדול מ-8.`,TPL.farDrag.b('far',[1,1],[-2,3]),`יפה! למשל ${co(9,0)} – 9 משבצות מהראשית.`)],

{id:8,icon:'rect',title:'מלבנים וריבועים מקבילים לצירים',sub:'קודקודים חסרים ואורכי צלעות',ex:'תרגילים 32–33',
 today:'היום נעבוד עם מלבנים וריבועים ש<b>צלעותיהם מקבילות לצירים</b>: נמצא קודקודים חסרים ואורכי צלעות.',
 lesson:[
  I(`במלבן שצלעותיו מקבילות לצירים, הצלעות <b>שוכבות</b> או <b>עומדות</b>. לכן יש בו רק <b>שני</b> מספרי X ו<b>שני</b> מספרי Y שונים! גרור את הקודקוד C וראה איך כל הפינות זזות יחד.`,P=>{P.auto.axis=false;P.auto.guides=false;P.auto.segments=false;P.add('A',2,2,{tag:true});P.add('C',7,6,{drag:true,tag:true,color:'#06b38a'});P.tapMove='C';P.polys=[{ids:['A','C'],close:false}];P.refresh();
   const upd=()=>{const A=P.pts.A,C=P.pts.C;P.pts.B||P.add('B',C.x,A.y,{tag:true,color:'#fb8500'});P.pts.D||P.add('D',A.x,C.y,{tag:true,color:'#fb8500'});P.pts.B.x=C.x;P.pts.B.y=A.y;P.pts.D.x=A.x;P.pts.D.y=C.y;P.polys=[{ids:['A','B','C','D'],fill:'#06d6a022',stroke:'#06b38a'}];P.relabel();};upd();const oc=P.onChange;P.onChange=id=>{upd();oc&&oc(id);};}),
  S(`תרגיל 32: נתונות A${co(2,5)} ו-C${co(8,0)}. AB מקביל לציר ה-X, ו-BC מקביל לציר ה-Y. ל-B יש <b>אותו Y כמו A</b> ו<b>אותו X כמו C</b>. מצא את B ואת אורכי AB ו-BC.`,TPL.rectB.b([2,5],[8,0],true),`נכון! B היא ${co(8,5)}, AB = 8−2 = 6, BC = 5−0 = 5.`),
  S(`נתונים שלושה קודקודים של מלבן. הקודקוד הרביעי לוקח את ה-X ואת ה-Y ש<b>מופיעים רק פעם אחת</b>.`,TPL.rectVert.b([2,3],[7,3],[7,8]),`נכון! ה-X שמופיע פעם אחת הוא 2 וה-Y הוא 8: D = ${co(2,8)}.`),
  S(`תרגיל 33: נתונות רק שתי פינות <b>מנוגדות</b> – D ו-B. מצא את A ואת C. (כל אחת לוקחת X מפינה אחת ו-Y מהשנייה.)`,TPL.rectTwo.b([3,5],[9,3],['D','B','A','C']),`נהדר! A = ${co(9,5)} ו-C = ${co(3,3)}.`),
  S(`ריבוע הוא מלבן ששתי צלעותיו שוות. סמן שלוש נקודות A, B, C כך ש-AB מקביל ל-X, BC מקביל ל-Y, ו-AB = BC (תרגיל 32ב).`,TPL.abc.b('sq'),`יפה! הצלעות שוות – זה ריבוע!`),
  S(`ריבוע עם צלע באורך 4: A${co(2,3)}. B ימינה מ-A, ו-D למעלה מ-A. מצא את B, C ו-D.`,TPL.squareFrom.b([2,3],4,1,1),`מעולה! B ${co(6,3)}, C ${co(6,7)}, D ${co(2,7)}.`),
  S(`ובסוף: מהם אורכי הצלעות של המלבן? (האופקית והאנכית)`,TPL.rectLens.b([1,2],[7,5]),`נכון! 7−1 = 6 ו-5−2 = 3.`)],

const ANG_ICON='angle';
const AQ=(name,...args)=>TPL[name].b(...args);
const aexplore=(spec)=>{spec.tapMode='arc';return spec;};
const dN=(spec,ar)=>[ar.a,ar.v,ar.b];
const aInfo=(say,spec,o)=>Object.assign({say,angle:spec,explore:true},o||{});
const aS=(say,q,ok)=>({say,q,ok});
const F2=diag('fan2',101,{V:'B',rays:['A','C'],pairs:[[0,1]]});
const F3=diag('fan3',102,{V:'B',rays:['A','D','C'],pairs:[[0,2],[0,1],[1,2]]});
const F3b=diag('fan3',102,{V:'B',rays:['A','D','C'],pairs:[[0,1],[1,2]]});
const TRI=diag('tri',103,{names:['A','B','C']});
const CEV=diag('cev',104,{names:['B','A','C','D'],sel:['Y','Z','Xl','Xr','Dl','Dr']});
const F5=diag('fan5',105,{V:'M',rays:['A','B','C','D','E'],pairs:[[0,1],[1,2],[0,2],[0,3],[2,4]]});
const FX=diag('fan3',201,{V:'B',rays:['A','D','C'],pairs:[[0,1],[1,2],[0,2]],ext:1});
const [EXR,EXN]=Object.entries(FX.meta.extra)[0];
const ANGU={id:'ang',icon:ANG_ICON,title:'זוויות',sub:'זיהוי זווית לפי 3 אותיות – כמה שמות לאותה זווית',ex:'כמו בתרגילי המודל (Moodle)',
 today:'איך קוראים לזווית בשלוש אותיות, איך מזהים איזו קשת שייכת לאיזו זווית, ואיך לזווית אחת יכולים להיות כמה שמות – בדיוק כמו בתרגילים באתר של בית הספר.',
 lesson:[
  aInfo(`שלום אדם! 📐 זו <b>זווית</b>: שתי קרניים שיוצאות מאותה נקודה – הקרן BA והקרן BC. הנקודה <b>B</b> שבה הן נפגשות נקראת <b>הקודקוד</b>. הקשת הצבעונית מראה כמה הקרניים "נפתחו". הקש על הקשת!`,aexplore(F2),{explainTap:true}),
  aS(`בשם של זווית כותבים <b>שלוש אותיות</b>, למשל ${angN(['A','B','C'])}. הסימן ∠ אומר "זווית". <b>האות האמצעית היא תמיד הקודקוד</b>. נסה: איפה הקודקוד של ${angN(['A','B','C'])}?`,AQ('vertexTap','fan2',101,{d:{V:'B',rays:['A','C'],pairs:[[0,1]]},ask:['A','B','C']}),`נכון! B באמצע, ולכן B הקודקוד.`),
  aS(`אפשר לקרוא את הזווית גם מהצד השני: ${angN(['A','B','C'])} ו-${angN(['C','B','A'])} הן <b>אותה זווית</b>, כי B נשארת באמצע. סמן את <b>שני השמות</b> של הזווית המסומנת (יש כאן יותר מתשובה אחת נכונה – סמן את שתיהן ואז לחץ בדוק).`,AQ('nameArc','fan2',101,{lv:'e',d:{V:'B',rays:['A','C'],pairs:[[0,1]]},ask:['C','B','A']}),`יפה! אותה זווית, שני שמות.`),
  aInfo(`לפעמים יוצאות מאותו קודקוד <b>כמה קרניים</b>, ואז יש כמה זוויות. כאן מ-B יוצאות שלוש קרניים (BA, BD, BC) ולכן יש שלוש זוויות. כל קשת מתחילה בקרן אחת ונגמרת בקרן אחרת. הקש על כל קשת וראה איך קוראים לה.`,aexplore(F3)),
  aS(`בוא נחפש קשת. ${angN(['A','B','C'])}: הקודקוד B, והקשת צריכה להגיע מהקרן BA אל הקרן BC – שימו לב, ממש עד הקרן הרחוקה, מעל D.`,AQ('tapArc','fan3',102,{d:{V:'B',rays:['A','D','C'],pairs:[[0,2],[0,1],[1,2]]},ask:['A','B','C']}),`מעולה! הקשת הגדולה, מ-A עד C.`),
  aS(`ועכשיו קשת קטנה בתוך הגדולה: ${angN(['A','B','D'])}. הקרן הראשונה BA, והאחרונה BD – ושם הקשת נעצרת.`,AQ('tapArc','fan3',102,{d:{V:'B',rays:['A','D','C'],pairs:[[0,2],[0,1],[1,2]]},ask:['A','B','D']}),`בדיוק! עצרת ב-D ולא המשכת ל-C.`),
  aS(`כמה זוויות יש כשיוצאות 3 קרניים? ${angN(['A','B','D'])}, ${angN(['D','B','C'])} ו-${angN(['A','B','C'])}. עכשיו תספור לבד: מהנקודה M יוצאות <b>4 קרניים</b> – כמה זוויות שונות יש?`,AQ('countFan',4,106,{d:{V:'M',rays:['A','B','C','D'],nArcs:0}}),`כן – 6 זוויות! כל זוג קרניים יוצר זווית.`),
  aInfo(`שתי זוויות שנמצאות אחת ליד השנייה וחולקות קרן אחת נקראות <b>זוויות סמוכות</b>. כאן ${angN(['A','B','D'])} ו-${angN(['D','B','C'])} סמוכות, והקרן <b>BD</b> היא הקרן המשותפת שלהן.`,aexplore(F3b)),
  aS(`ועכשיו הזווית הגדולה ${angN(['A','B','C'])} <b>מורכבת</b> משתיהן: ${angN(['A','B','D'])} + ${angN(['D','B','C'])}. איזו זווית מורכבת מ-${angN(['A','B','D'])} ו-${angN(['D','B','C'])}?`,AQ('sumMC','fan3',102,{d:{V:'B',rays:['A','D','C']}}),`נכון! ∠ABC = ∠ABD + ∠DBC.`),
  aInfo(`גם <b>במשולש</b> יש זוויות. הזווית בקודקוד B של המשולש ABC היא ${angN(['A','B','C'])} – האות האמצעית היא הקודקוד, והשתיים האחרות הן קצוות הצלעות שיוצאות ממנו. הקש על הקשתות!`,aexplore(TRI)),
  aS(`בוא נתרגל: הקש על הקשת של ${angN(['A','B','C'])} במשולש. תחשוב – באיזה קודקוד היא יושבת?`,AQ('tapArc','tri',103,{d:{names:['A','B','C']},ask:['A','B','C']}),`נכון! הזווית בקודקוד B.`),
  aInfo(`עכשיו משולש עם קטע נוסף: מהקודקוד B יוצא קטע אל הנקודה D שעל הצלע AC. מ-B יוצאות <b>שלוש</b> קרניים (BA, BD, BC), ולכן יש שם שתי זוויות קטנות ואחת גדולה. גם ב-D יש זוויות. הקש על הקשתות וראה!`,aexplore(CEV)),
  aS(`בתמונה כזו ברוב התרגילים שואלים על הזוויות הקטנות. חפש את הקשת של ${angN(['C','B','D'])}: קודקוד B, בין הקרן BC לקרן BD.`,AQ('tapArc','cev',104,{d:{names:['B','A','C','D'],sel:['Y','Z','Xl','Xr','Dl','Dr']},ask:['C','B','D']}),`יפה מאוד! זו הזווית הקטנה בצד C.`),
  aInfo(`🔑 <b>רעיון חשוב:</b> על קרן אחת יכולות להיות <b>שתי נקודות</b> עם שמות! כאן על הקרן B${EXR} יש את ${EXN} ואת ${EXR}. אפשר לקרוא לקרן "B${EXR}" וגם "B${EXN}" – זו אותה קרן! לכן ל<b>אותה זווית</b> יש <b>כמה שמות</b>. הקש על הקשתות וראה את כל השמות שלהן.`,aexplore(FX)),

function bindCards(root){
  root.querySelectorAll('[data-u]').forEach(c=>{
    c.onclick=e=>{if(e.target.closest('button'))return;openStages(parseU(c.dataset.u));};
    c.onkeydown=e=>{if(e.key==='Enter'&&e.target===c)openStages(parseU(c.dataset.u));};});
  root.querySelectorAll('.nBtn').forEach(b=>b.onclick=e=>{e.stopPropagation();startNext(parseU(b.dataset.u));});
  root.querySelectorAll('.sBtn').forEach(b=>b.onclick=e=>{e.stopPropagation();openStages(parseU(b.dataset.u));});
  root.querySelectorAll('.chBtn').forEach(b=>b.onclick=e=>{e.stopPropagation();startChallenge(parseU(b.dataset.u));});
  root.querySelectorAll('.pBtn').forEach(b=>b.onclick=e=>{e.stopPropagation();openProgress(b.dataset.u);});
  root.querySelectorAll('.lBtn').forEach(b=>b.onclick=e=>{e.stopPropagation();const u=parseU(b.dataset.u);openLesson(u,!lessonDone(u));});
}

let HUB=null;
function openStages(u){HUB=u;show('unit');renderStages();}
function renderStages(){const u=HUB,U=getU(u);const s=starsOf(u),d=diasOf(u),nx=nextStage(u);
  $('#hubMascot').innerHTML=ROBO;$('#hubNum').textContent=`נושא ${numOf(u)}`;$('#hubTitle').textContent=U.title;
  $('#hubSay').innerHTML=isDone(u)?`🏆 <b>הושלם!</b> אספת את כל 10 הכוכבים ואת 3 היהלומים. אפשר לתרגל כל שלב שוב.`:`⭐ ${s} מתוך 10 · 💎 ${d} מתוך 3. השאלות עולות בקושי משלב לשלב. כדי להשיג שלב צריך לענות נכון על <b>כל</b> השאלות בניסיון הראשון. ${s<10?'💎 היהלומים נפתחים אחרי 10 כוכבים.':''}`;
  const tile=i=>{const S=STAGES[i];const ok=earned(u,i),open=stageOpen(u,i),isNext=nx===i,b=bestStage(u,i);
    const state=ok?'✓ הושג':!open?`🔒 צריך 10 כוכבים`:isNext?'▶ השלב הבא':b?`שיא: ${b}/${S.n}`:'פתוח';
    return `<button class="stg k-${S.kind} ${ok?'earned':''} ${isNext?'next':''} ${open?'':'locked'}" data-i="${i}" aria-label="${stageName(i)}"><span class="sico">${S.kind==='star'?starSvg(ok?'#ffbe0b':'#e3e8f4','sg'):diaSvg(ok,'sg')}</span><b class="snum">${S.kind==='star'?S.num:S.num}</b><span class="slab">${STAGE_LABELS[i]}</span><small class="sn">${S.n} שאלות</small><span class="sst">${state}</span></button>`;};
  $('#hubSteps').innerHTML=`<h3 class="stgh">⭐ שלבי כוכב – 7 שאלות בכל שלב</h3><div class="stgrid">${Array.from({length:10},(_,i)=>tile(i)).join('')}</div>
    <h3 class="stgh">💎 שלבי יהלום – 10 שאלות קשות ${s<10?'<small>(נפתחים אחרי 10 כוכבים)</small>':''}</h3><div class="stgrid dg">${[10,11,12].map(tile).join('')}</div>
    <div class="stgacts"><button class="btn ghost" id="hubLesson">${lessonDone(u)?'📖 הסבר ✓':'📖 הסבר'}</button><button class="btn chal ${chalCount(u)?'':'zero'}" id="hubChal">🔥 היה מאתגר (${chalCount(u)})</button><button class="btn ghost" id="hubProg">📈 הטעויות וההתקדמות</button></div>`;

/* ============ LESSONS ============ */
let LS=null;
function openLesson(u,resume){const U=getU(u);const i=resume?Math.min(SAVE.lstep[u]||0,U.lesson.length-1):0;LS={u,unit:U,i,done:false};show('lesson');renderStep();}
function renderStep(){
  const U=LS.unit,st=U.lesson[LS.i];SAVE.lstep[LS.u]=LS.i;persist();
  $('#lTitle').innerHTML=`<span style="width:44px;height:44px;display:inline-block">${ICONS[U.icon]}</span>${U.id==='ang'?'נושא 10: ':'יחידה '+U.id+': '}${U.title}`;
  $('#lSteps').innerHTML=U.lesson.map((_,k)=>`<i class="${k<LS.i?'on':k===LS.i?'cur':''}"></i>`).join('');
  say('#lTalk',st.say,null);$('#lTask').className='task';$('#lAns').innerHTML='';$('#lAns')._key=null;
  const next=$('#lNext');LS.q=st.q||null;LS.step=st;
  next.textContent=LS.i===U.lesson.length-1?'סיים שיעור ✓':'הבא ←';$('#lPrev').style.visibility=LS.i?'visible':'hidden';
  const success=()=>{LS.done=true;$('#lTask').classList.add('ok');say('#lTalk',st.say+'<div class="okline">✅ '+(st.ok||'כל הכבוד!')+'</div>','happy');sfx('good');next.disabled=false;next.classList.add('pulse');if(LS.q&&LS.q.after)LS.q.after(LS.ctl.P);if(LS.ctl)readout($('#lRead'),LS.ctl.P,LS.q?LS.q.read||[]:null);};
  if(st.q){
    LS.done=false;next.disabled=true;next.classList.remove('pulse');
    $('#lTask').innerHTML='🎯 '+st.q.prompt;
    LS.ctl=mountQ(st.q,{plane:'#lPlane',ans:'#lAns',read:'#lRead',auto:true,quiz:false,say:null,isDone:()=>LS.done,
      result:ok=>{if(LS.done)return;if(ok){if(LS.ctl.P)LS.ctl.P.locked=true;success();}else{sfx('bad');say('#lTalk','כמעט! 💡 '+st.q.hint,'oops');}}});
  }else{
    LS.done=true;next.disabled=false;next.classList.add('pulse');$('#lTask').innerHTML=st.task?('🎯 '+st.task):'';
    if(st.angle){const P=makeAngleBoard($('#lPlane'),st.angle);LS.ctl={P};$('#lRead').innerHTML='';
      if(st.explore)P.onTap=id=>{const ar=st.angle.arcs.find(a=>a.id===id);if(!ar)return;P.arcEls[id].classList.add('good');setTimeout(()=>P.arcEls[id]&&P.arcEls[id].classList.remove('good'),900);const nm=[ar.a,ar.v,ar.b];const eq=equivNames(st.angle,nm).filter((x,i,A)=>A.findIndex(y=>y.join('')===x.join(''))===i);const names=eq.slice(0,4).map(angN).join(' = ');
        say('#lTalk',st.say+`<div class="okline">👆 הקשת שהקשת עליה: ${names}. הקודקוד: <b>${ar.v}</b> (האות האמצעית).</div>`,'happy');};}
    else{const P=makePlane($('#lPlane'),st.board);LS.ctl={P};const upd=()=>readout($('#lRead'),P,Object.keys(P.pts).filter(id=>P.pts[id].o.drag));P.onChange=upd;P.onDrop=upd;st.setup(P);P.refresh();upd();}
  }
}
$('#lPrev').onclick=()=>{if(LS.i>0){LS.i--;renderStep();}};
$('#lNext').onclick=()=>{if(!LS.done)return;const U=LS.unit;if(LS.i<U.lesson.length-1){LS.i++;renderStep();return;}
  const rec=US(U.id);const first=!rec.lesson;rec.lesson=true;delete SAVE.lstep[U.id];persist();sfx('win');confetti(2200,110);
  modal(`<div class="mascot mood-happy" style="margin:0 auto;width:110px;height:118px">${ROBO}</div><h2>סיימת את השיעור, אדם! 🎉</h2>

  <p style="font-size:18px;margin:4px 0 10px">עכשיו תרגול: שלבי כוכב ⭐ של 7 שאלות, מהקל לקשה.</p>
  <div style="display:flex;gap:12px;justify-content:center;margin-top:10px;flex-wrap:wrap"><button class="btn green" id="mPrac">✏️ לתרגול</button><button class="btn ghost" id="mHome">🗺️ למסלול</button></div>`);

};

let SP=null;
function openSandbox(){show('sandbox');SP=makePlane($('#sPlane'),STD);SP.add('A',2,3,{drag:true});SP.add('B',6,3,{drag:true});SP.add('C',-3,-2,{drag:true});SP.showTags=true;SP.relabel();
  const upd=()=>{readout($('#sRead'),SP,['A','B','C']);const ids=['A','B','C'];const notes=[];
    for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){const a=SP.pts[ids[i]],b=SP.pts[ids[j]];

    EXAM_TOPICS.forEach((u,ti)=>{const cnt=((ti+k*2)%9)<7?3:2;const pool=seededShuffle(getBank(u).slice(EXAM_FROM),'exammix:'+u);
      const part=pool.slice(k*3,k*3+cnt).sort((a,b)=>a.rank-b.rank);out=out.concat(part);});}
  return EXAM_CACHE[id]=out;}
function examRec(id){if(!SAVE.exams||typeof SAVE.exams!=='object'||Array.isArray(SAVE.exams))SAVE.exams={};let r=SAVE.exams[id];if(!r||typeof r!=='object')r=SAVE.exams[id]={best:null,n:0,last:null};if(!Number.isFinite(+r.n))r.n=0;if(r.best!=null&&!Number.isFinite(+r.best))r.best=null;return r;}
function examsClean(){try{if(!SAVE.exams||typeof SAVE.exams!=='object'||Array.isArray(SAVE.exams))SAVE.exams={};Object.keys(SAVE.exams).forEach(k=>{if(!EXAMS.some(e=>e.id===k))delete SAVE.exams[k];else examRec(k);});}catch(e){SAVE.exams={};}}
function openExams(){closeModal();show('exams');renderExams();}
function renderExams(){const tile=E=>{const r=examRec(E.id);return `<button class="extile ${E.kind}" data-ex="${E.id}"><span class="exnum">${E.num}</span><span class="exb"><b>${E.title}</b><small>${E.sub} · ${EXAM_N} שאלות</small><span class="exbest">${r.best==null?'עוד לא נבחנתי':`🏅 השיא שלי: <b>${r.best}/100</b> · ${r.n} ניסיונות`}</span></span></button>`;};
  $('#examBody').innerHTML=`<h1>📝 מבחנים</h1><p class="psub">כל מבחן: <b>${EXAM_N} שאלות</b> ברמה בינונית וקשה. <b>בלי רמזים</b> ובלי לדעת מיד אם צדקת – כמו מבחן אמיתי בכיתה! בסוף מקבלים ציון מתוך 100 ורואים בדיוק איפה טעית. בהצלחה, אדם! 🍀</p>
   <h3 class="ph3">🌍 מבחנים מסכמים</h3><div class="exgrid">${EXAMS.filter(e=>e.kind==='mix').map(tile).join('')}</div>
   <h3 class="ph3">📚 מבחן לכל נושא</h3><div class="exgrid">${EXAMS.filter(e=>e.kind==='topic').map(tile).join('')}</div>
   <div class="navrow" style="margin-top:18px"><button class="btn ghost" id="exProg">📈 התקדמות במבחנים</button><button class="btn ghost" id="exBack">→ למסלול</button></div>`;
  $('#examBody').querySelectorAll('.extile').forEach(b=>b.onclick=()=>startExam(b.dataset.ex));
  $('#exBack').onclick=()=>show('home');$('#exProg').onclick=()=>openProgress('exam');}
function startExam(id){closeModal();const E=EXAMS.find(e=>e.id===id);if(!E)return;const qs=[];examEntries(id).forEach(e=>{try{qs.push(makeQ(e));}catch(err){}});
  Q={qt:[],mode:'exam',exam:E,u:'exam',title:`📝 ${E.title}`,qs,idx:0,res:[],score:0,streak:0,first:true,done:false,elog:[]};
  document.querySelector('#quiz').classList.add('examMode');show('quiz');renderQ();}
/* one answer per question; neutral feedback; record it and move on */
function examAnswer(ok,given){const q=Q.qs[Q.idx];if(Q.done)return;const secs=tmStop()/1000;Q.done=true;if(Q.P)Q.P.locked=true;Q.qt[Q.idx]=Math.round(secs*10)/10;
  Q.res[Q.idx]=ok?'st':'x';if(ok){Q.score++;markOk(q);}
  else{try{const pk=String(q.entry.u);const r={t:Date.now(),e:{u:q.entry.u,lvl:q.entry.lvl,tpl:q.entry.tpl,args:q.entry.args,key:q.entry.key},st:`📝 מבחן ${Q.exam.num}`,g:[givenTxt(q,given)],c:correctTxt(q,Q.P),s:Math.round(secs),pr:clip(String(q.prompt||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' '),200),fx:false,ex:Q.exam.id};
    Q.elog.push(r);if(LOG_KEYS.includes(pk)){const L=mlogOf(pk);L.push(r);if(L.length>LOG_CAP)L.splice(0,L.length-LOG_CAP);}persistSafe();}catch(e){}}
  sfx('tick');say('#qTalk','✍️ התשובה נשמרה. ממשיכים!',null);try{readout($('#qRead'),Q.P,q.read||[]);}catch(e){}renderProg();
  const btn=$('#qNext');btn.style.display='';btn.textContent=Q.idx===Q.qs.length-1?'סיום המבחן 🏁':'לשאלה הבאה ←';const qc=$('#qCheck');if(qc)qc.style.display='none';
  $('#qAns').querySelectorAll('button').forEach(b=>b.disabled=true);}
function finishExam(){Q.finished=true;document.querySelector('#quiz').classList.remove('examMode');const E=Q.exam,n=Q.qs.length,c=Q.score,score=scoreFor(c,n);
  const AT=recordAttempt();AT.m='exam';AT.ex=E.id;AT.u='exam';const r=examRec(E.id);const prev=r.best;r.n++;r.last=score;if(prev==null||score>prev)r.best=score;persistSafe();show('summary');
  const msg=score===100?'100! מושלם! 🏆 אתה אלוף!':score>=85?'מצוין! 🌟':score>=70?'יפה מאוד! 💪':score>=55?'עבר! ממשיכים להשתפר 🌱':'התחלה – עכשיו לומדים מהטעויות 🌱';
  const L=Q.elog;
  $('#sumCard').innerHTML=`<div class="qnum" style="font-size:18px">${Q.title}</div><div class="sumscore" id="sumScore">${score}<small>/100</small></div>
   <div class="rdots">${Q.res.map(x=>`<i class="${x==='st'?'st':'bad'}"></i>`).join('')}</div>
   <div class="summsg">${msg}</div><div class="sumsub">נכון: <b>${c} מתוך ${n}</b>${prev!=null?` · השיא הקודם: <b>${prev}/100</b>${score>prev?' – 🎉 שיא חדש!':''}`:''}</div>${timeLine(AT)}
   <div class="exreview"><h3 class="ph3">${L.length?`🔍 בדיקת המבחן – ${L.length} טעויות`:'🎉 אין טעויות בכלל!'}</h3>${L.map((r,i)=>mistakeItem(r,'x'+i)).join('')}</div>
   <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn orange" id="exAgain">🔄 עוד פעם את המבחן</button><button class="btn" id="exList">📝 לכל המבחנים</button><button class="btn ghost" id="toMap">🗺️ למסלול</button></div>`;
  bindDiag($('#sumCard'),i=>L[+String(i).slice(1)]);
  $('#exAgain').onclick=()=>startExam(E.id);$('#exList').onclick=openExams;$('#toMap').onclick=()=>show('home');
  if(score>=85){sfx('win');confetti(3500,200);}else sfx('good');}

examsClean();persist();renderHome();

</script>
